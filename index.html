<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#003478">
<title>Bloom Repair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500;600&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout concept: one-hand shop tool. Graphite header, tab row, card lists, full-height sheets for jobs and scans. */
:root{
  --bg:#f4f6f8;--surface:#ffffff;--surface2:#e2e7ea;--ink:#1b2025;--muted:#59646d;--line:#cdd5da;
  --head:#003478;--head-ink:#ffffff;--brand:#003478;--brand-ink:#ffffff;--brand-soft:#dce6f5;
  --est:#8a5a00;--est-soft:#fbebc8;--open:#235ea6;--open-soft:#dbe8f7;--ready:#11706a;--ready-soft:#d2eeea;
  --inv:#6a47a6;--inv-soft:#e8e0f6;--paid:#1b7547;--paid-soft:#d6efe0;--bad:#b3261e;--bad-soft:#fbdedb;
  --watch:#8a5a00;--watch-soft:#fbebc8;
  --paper:#ffffff;--paper-ink:#1a1a1a;--paper-line:#cfcfcf;--paper-muted:#666666;
  --shadow:0 1px 2px rgba(20,30,40,.08),0 4px 14px rgba(20,30,40,.07);
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Public Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow-x:clip;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 60px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--head)}
.cropv{position:relative;border-radius:10px;overflow:hidden;background:#000}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{touch-action:manipulation}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:20px}h3{font-size:16px}
.wrap{max-width:980px;margin:0 auto}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono);letter-spacing:.02em}
.muted{color:var(--muted)}.small{font-size:13px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.grow{flex:1;min-width:0}
a{color:var(--open)}

/* header + nav */
.top{border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--head);color:var(--head-ink)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:9px}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.brand svg{width:30px;height:30px;color:var(--brand);flex:none}
.brand b{font:800 22px/1 var(--f-display);letter-spacing:.01em}
.brand span{display:block;font:600 10px/1 var(--f-body);letter-spacing:.28em;text-transform:uppercase;opacity:.8;margin-top:3px}
.who{display:flex;align-items:center;gap:7px;border:1px solid var(--line);background:transparent;color:inherit;border-radius:999px;padding:4px 11px 4px 5px;cursor:pointer;min-height:36px}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:15;margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px));background:var(--bg);border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:12px 13px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;min-height:44px}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--brand)}
.tab .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--surface2);font-size:11px;line-height:18px;text-align:center}
.searchrow{padding:0 0 10px}
.searchrow input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
main{padding-top:14px;display:grid;gap:12px}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 130px}
.linkbtn{background:none;border:0;color:var(--open);text-decoration:underline;padding:4px 0;cursor:pointer;font-weight:500}
.field{display:grid;gap:4px;min-width:0}
.field>span{font:600 12px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=tel],input[type=email],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);min-width:0}
textarea{min-height:76px;resize:vertical}
input:focus-visible,select:focus-visible,textarea:focus-visible,.btn:focus-visible,.tab:focus-visible,button:focus-visible{outline:3px solid var(--brand);outline-offset:1px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:480px){.g3{grid-template-columns:1fr 1fr}}
.chk{display:flex;align-items:center;gap:8px;min-height:34px}
.chk input{width:20px;height:20px}

/* cards, pills, chips */
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow);min-width:0}
.card.tap{cursor:pointer}.card.tap:hover{border-color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.between>*{min-width:0}
.between>.pill,.between>.btn{flex:none}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.estimate{background:var(--est-soft);color:var(--est)}.pill.open{background:var(--open-soft);color:var(--open)}
.pill.upcoming{background:var(--surface2);color:var(--muted)}
.pill.ready{background:var(--ready-soft);color:var(--ready)}.pill.invoiced{background:var(--inv-soft);color:var(--inv)}
.pill.paid{background:var(--paid-soft);color:var(--paid)}.pill.bad,.pill.overdue{background:var(--bad-soft);color:var(--bad)}
.pill.soon,.pill.watch{background:var(--watch-soft);color:var(--watch)}.pill.ok{background:var(--paid-soft);color:var(--paid)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;min-height:36px}
.chip[aria-pressed=true]{background:var(--brand);color:#fff;border-color:var(--brand)}
.dot{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;font-size:11px;font-weight:800;color:#1b1b1b;flex:none;border:2px solid var(--surface)}
.dots{display:flex}.dots .dot+.dot{margin-left:-7px}
.empty{padding:26px 14px;text-align:center;color:var(--muted)}
.vin{font-family:var(--f-mono);font-size:13px;letter-spacing:.04em}
.title-line{font:700 16px var(--f-display)}
.sub{color:var(--muted);font-size:13.5px}
.due{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding:9px 0;border-top:1px solid var(--line)}
.due:first-of-type{border-top:0}
.due .grow{flex:1 1 170px;min-width:0}
.due .btnrow{flex:1 0 100%!important}
.due .btnrow .btn{flex:1 1 80px;text-align:center}
.banner{background:var(--est-soft);color:var(--est);border-radius:10px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
body.tech .price{display:none!important}

/* sheets */
#modal,#scan{position:fixed;inset:0;z-index:50;display:none}
#scan{z-index:60}
#modal.on,#scan.on{display:block}
.shade{position:absolute;inset:0;background:#0009}
.sheet{position:absolute;left:50%;transform:translateX(-50%);top:max(0px,env(safe-area-inset-top,0px));bottom:0;width:min(760px,100%);background:var(--bg);display:flex;flex-direction:column;
  border-radius:14px 14px 0 0;box-shadow:0 -8px 40px #0006}
.sheet-h{display:flex;align-items:center;gap:10px;padding:12px max(14px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line);border-radius:14px 14px 0 0}
.sheet-h h2{flex:1;min-width:0;font-size:18px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet-b{flex:1;overflow-y:auto;padding:14px max(14px,env(safe-area-inset-left,0px)) 90px;display:grid;gap:12px;align-content:start;-webkit-overflow-scrolling:touch}
.sec{display:grid;gap:10px}
.sec>h3{display:flex;align-items:center;justify-content:space-between;gap:8px}
.bigbtn{display:flex;align-items:center;gap:12px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;min-height:64px;width:100%}
.bigbtn:hover{border-color:var(--brand)}
.bigbtn svg{width:30px;height:30px;color:var(--brand);flex:none}
.bigbtn b{display:block;font:700 16px var(--f-display)}
.sheet-b{align-content:start;grid-auto-rows:min-content}
.sheet-b>*{min-width:0}
.step{min-height:40px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.step button{flex:1 0 auto;border:1px solid var(--line);background:var(--surface);padding:8px 10px;font-weight:700;font-size:13px;cursor:pointer;border-radius:8px;min-height:38px}
.step button[aria-current=true]{background:var(--brand);color:#fff;border-color:var(--brand)}

/* job card lines */
.line{display:grid;grid-template-columns:1fr auto;gap:6px 10px;padding:10px 0;border-top:1px solid var(--line)}
.line:first-of-type{border-top:0}
.line .l1{font-weight:600;overflow-wrap:anywhere}
.line .ctl{display:flex;gap:8px;flex-wrap:wrap;grid-column:1/-1;align-items:end}
.line .ctl .field{flex:1 1 70px}
.totals{display:grid;gap:4px;justify-items:end;font-variant-numeric:tabular-nums}
.totals div{display:flex;gap:18px;justify-content:space-between;min-width:210px}
.totals .grand{font:800 20px var(--f-display);border-top:2px solid var(--ink);padding-top:6px;margin-top:4px}

/* inspection */
.igrp{font:700 12px var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:10px 0 4px}
.irow{border-top:1px solid var(--line);padding:9px 0;display:grid;gap:7px}
.irow .t{font-weight:600}
.seg3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg3 button{border:1px solid var(--line);background:var(--surface);border-radius:8px;min-height:40px;font-weight:700;cursor:pointer}
.seg3 button[aria-pressed=true][data-r=ok]{background:var(--paid-soft);color:var(--paid);border-color:var(--paid)}
.seg3 button[aria-pressed=true][data-r=watch]{background:var(--watch-soft);color:var(--watch);border-color:var(--watch)}
.seg3 button[aria-pressed=true][data-r=bad]{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}

/* photos + notes */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph{position:relative;border-radius:8px;overflow:hidden;background:var(--surface2);aspect-ratio:1;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
.ph button{position:absolute;top:4px;right:4px;border:0;background:#000a;color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer}
.note{border-left:3px solid var(--line);padding:2px 0 2px 10px;white-space:pre-wrap;overflow-wrap:anywhere}

/* scanner */
.shot{position:relative;display:flex;justify-content:center;background:#000;border-radius:10px;overflow:hidden}
.shot canvas{max-height:56vh;width:auto;display:block;touch-action:none;cursor:crosshair;max-width:100%}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.cand{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;cursor:pointer;min-height:52px}
.cand:hover{border-color:var(--brand)}
.cand b{font-family:var(--f-mono);font-size:16px;letter-spacing:.04em;overflow-wrap:anywhere}
.sigpad{width:100%;height:150px;border:1px dashed var(--muted);border-radius:8px;background:var(--surface);touch-action:none;display:block}

/* estimate + invoice paper */
.paper{background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:22px;box-shadow:var(--shadow);font-size:13.5px}
.paper h1{font:800 22px var(--f-display);margin:0}
.paper table{width:100%;border-collapse:collapse;margin-top:10px}
.paper th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;text-align:left;border-bottom:2px solid var(--paper-ink);padding:5px 4px;color:var(--paper-muted)}
.paper td{padding:6px 4px;border-bottom:1px solid var(--paper-line);vertical-align:top}
.paper .r{text-align:right;font-variant-numeric:tabular-nums}
.paper .meta{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:12px}
.paper .sig img{height:60px;display:block}
.paper .mono{font-family:var(--f-mono)}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(24px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:90;font-weight:600;max-width:90vw}
.lightbox{position:fixed;inset:0;z-index:80;background:#000e;display:flex;align-items:center;justify-content:center;padding:16px}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px}

@media print{
  body{background:#fff;padding:0}body::before,.top,.nav,main,.shade,.sheet-h,.noprint{display:none!important}
  #modal,#modal.on{position:static!important;display:block!important}
  .sheet{position:static!important;transform:none!important;width:auto!important;box-shadow:none!important;background:#fff!important;border-radius:0!important}
  .sheet-b{overflow:visible!important;padding:0!important}
  .paper{box-shadow:none!important;padding:0!important}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

.cand b.nm,.cand .nm{font-family:var(--f-body);letter-spacing:0}

.btnrow.tight .btn{flex:1 1 0;min-width:0;padding-inline:6px}

.camv{position:relative;width:100%;height:min(58vh,460px);background:#000;border-radius:14px;overflow:hidden}
.camv video{width:100%;height:100%;object-fit:cover;display:block}
.camframe{position:absolute;border:3px solid #fff;border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.55);pointer-events:none}
.camrot{display:none;position:absolute;inset:0;z-index:2;background:rgba(0,0,0,.82);color:#fff;font-weight:700;font-size:17px;text-align:center;align-items:center;justify-content:center;padding:20px}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){.camrot{display:flex}}

.top{border-bottom:0}
.brand svg{color:#fff;fill:#fff}
.top .btn.pri{background:#fff;color:#003478;border-color:#fff}
.top .who{border-color:rgba(255,255,255,.5)}
.btn.camshot{min-height:68px;font-size:21px;border-radius:14px;letter-spacing:.01em}

</style>
</head>
<body>
<div id="app">
  <header class="top"><div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.5 4.5a6.5 6.5 0 0 0-6.2 8.4L5 23.2a2.9 2.9 0 0 0 4.100 4.100l10.300-10.300a6.500 6.500 0 0 0 8.400-6.200l-4.300 4.300-3.400-.9-.9-3.400z"/></svg>
      <div><b>Bloom</b><span>Repair</span></div>
    </div>
    <div class="grow"></div>
    <button class="who" data-act="switchUser" id="who" aria-label="Switch user"></button>
    <button class="btn pri" data-act="newJob">+ New job</button>
  </div></header>
  <div class="nav"><div class="wrap">
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="searchrow" id="searchrow"><input id="q" type="search" placeholder="Search" autocomplete="off" aria-label="Search"></div>
  </div></div>
  <div class="wrap"><main id="view"></main></div>
</div>
<div id="modal"></div>
<div id="scan"></div>
<script>
/* Pure logic. No DOM access, so Node can test it. */
const num=v=>{const n=parseFloat(String(v==null?'':v).replace(/[^0-9.\-]/g,''));return isFinite(n)?n:0};
const r2=n=>Math.round((+n||0)*100)/100;
const money=n=>(n<0?'-':'')+'$'+Math.abs(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtNum=n=>Math.round(+n||0).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>ymd(new Date());
const dObj=s=>new Date(s+'T12:00:00');
const addDays=(s,n)=>{const d=dObj(s);d.setDate(d.getDate()+n);return ymd(d)};
const addMonths=(s,n)=>{const d=dObj(s),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+n);
  const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();d.setDate(Math.min(day,last));return ymd(d)};
const daysBetween=(a,b)=>Math.round((dObj(b)-dObj(a))/864e5);
const fmtDate=s=>s?dObj(s.slice(0,10)).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fmtPhone=s=>{const d=String(s||'').replace(/\D/g,'').replace(/^1(?=\d{10})/,'').slice(0,10);
  if(d.length<=3)return d;if(d.length<=6)return '('+d.slice(0,3)+') '+d.slice(3);return '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6)};

/* ---------- VIN ---------- */
const TRANSLIT={A:1,B:2,C:3,D:4,E:5,F:6,G:7,H:8,J:1,K:2,L:3,M:4,N:5,P:7,R:9,S:2,T:3,U:4,V:5,W:6,X:7,Y:8,Z:9};
const WEIGHTS=[8,7,6,5,4,3,2,10,0,9,8,7,6,5,4,3,2];
const VIN_RE=/^[A-HJ-NPR-Z0-9]{17}$/;
const YEAR_CHARS='ABCDEFGHJKLMNPRSTVWXY123456789';
const CONF=[['0','D'],['5','S'],['8','B'],['2','Z'],['6','G'],['1','7'],['U','V'],['C','G'],['E','F'],['H','N'],['M','N']];
function checkDigitOK(v){
  if(!VIN_RE.test(v))return false;
  let sum=0;
  for(let i=0;i<17;i++){const c=v[i];sum+=(/\d/.test(c)?+c:TRANSLIT[c])*WEIGHTS[i]}
  const r=sum%11;return v[8]===(r===10?'X':String(r));
}
function plausible(v){return VIN_RE.test(v)&&YEAR_CHARS.includes(v[9])}
/* the word VIN printed in front of the number is a label, not part of it. OCR may read it as VIN, V1N, VlN or V|N, with or without a space or colon. */
function normalizeRun(s){
  let t=s.toUpperCase().replace(/\bV[I1L|!]N\b[:#.\-\s]*/g,' ').replace(/^\s*V[I1L|!]N[:#.\-]+/,' ');
  t=t.replace(/[^A-Z0-9]/g,'').replace(/I/g,'1').replace(/[OQ]/g,'0');
  if(t.length>=18&&/^V[1L]N/.test(t))t=t.slice(3);
  return t;
}
function candidatesFromText(text){
  const out=new Map();
  const all=text.split(/\r?\n/).map(normalizeRun);
  for(const s of all.filter(s=>s.length>=17)){
    for(let i=0;i+17<=s.length;i++){
      const w=s.slice(i,i+17);
      if(!VIN_RE.test(w))continue;
      const valid=checkDigitOK(w),exact=s.length===17,prev=out.get(w);
      if(!prev)out.set(w,{vin:w,valid,exact});else if(exact)prev.exact=true;
    }
  }
  /* Glare or a scratch can split one VIN into two fragments, sometimes out of order.
     A join only counts when the pieces add up to exactly 17 characters and the check digit passes. */
  if(![...out.values()].some(c=>c.valid)){
    const frags=all.filter(s=>s.length>=4&&s.length<17).sort((a,b)=>b.length-a.length).slice(0,5);
    for(const a of frags)for(const b of frags){
      if(a===b)continue;const s=a+b;
      if(s.length===17&&plausible(s)&&checkDigitOK(s)&&!out.has(s))out.set(s,{vin:s,valid:true,exact:false,joined:true});
    }
  }
  return [...out.values()];
}
function partialFromText(text){
  const runs=text.split(/\r?\n/).map(normalizeRun).filter(s=>s.length>=10&&s.length<17);
  runs.sort((a,b)=>b.length-a.length);return runs[0]||'';
}
function neighbors(ch){const s=new Set();for(const g of CONF)if(g.includes(ch))g.forEach(x=>{if(x!==ch)s.add(x)});return [...s]}
function repairs(vin){
  const res=[];if(vin.length!==17)return res;
  for(let i=0;i<17;i++)for(const n of neighbors(vin[i])){
    const t=vin.slice(0,i)+n+vin.slice(i+1);
    if(plausible(t)&&checkDigitOK(t))res.push({vin:t,pos:i,from:vin[i],to:n});
  }
  return res.slice(0,4);
}
function vinFromBarcode(t){
  let s=String(t||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
  if(s.length===18&&s[0]==='I')s=s.slice(1);
  s=s.replace(/[OQ]/g,'0');
  return VIN_RE.test(s)?s:null;
}
const cleanVin=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/I/g,'1').replace(/[OQ]/g,'0').slice(0,17);

/* ---------- odometer ---------- */
function odoCandidates(text){
  const out=new Map();
  for(const line of String(text).split(/\r?\n/)){
    for(const m of line.match(/\d{1,3}(?:,\d{3})+|\d+/g)||[]){
      const d=m.replace(/,/g,'');
      if(d.length<3||d.length>7)continue;
      const v=parseInt(d,10);
      let s=d.length>=5&&d.length<=6?3:(d.length===4||d.length===7?2:1);
      const cur=out.get(v);
      if(cur){cur.score+=1}else out.set(v,{miles:v,score:s});
    }
  }
  return [...out.values()].sort((a,b)=>b.score-a.score||b.miles-a.miles).slice(0,6);
}

/* ---------- part numbers ---------- */
const normPart=s=>String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function partCandidates(text){
  const out=new Map();
  const add=(raw,score,kind)=>{
    raw=String(raw).trim().replace(/^[\-.\/]+|[\-.\/]+$/g,'');
    const n=normPart(raw);if(n.length<3||n.length>20)return;
    const cur=out.get(n);if(!cur||cur.score<score)out.set(n,{text:raw,norm:n,score,kind});
  };
  const LBL=/\b(?:P\/N|PN|PART\s*(?:NO|NUM(?:BER)?|#)?|ITEM\s*(?:NO|#)?|MODEL|CAT(?:ALOG)?\s*(?:NO|#)?|SKU|REF)\b\.?\s*[:#]?\s*([A-Z0-9][A-Z0-9\-\/.]{2,19})/g;
  for(const line of String(text).toUpperCase().split(/\r?\n/)){
    let m;LBL.lastIndex=0;
    while((m=LBL.exec(line)))add(m[1],8,'part');
    for(const u of line.match(/\b\d[\d ]{9,16}\d\b/g)||[]){const d=u.replace(/ /g,'');if(d.length>=11&&d.length<=14)add(d,3,'upc')}
    for(const t of line.match(/[A-Z0-9][A-Z0-9\-\/.]{2,19}/g)||[]){
      if(!/\d/.test(t))continue;
      if(/^\$?\d+\.\d{2}$/.test(t))continue;
      if(/^\d{1,2}[\/.\-]\d{1,2}[\/.\-]\d{2,4}$/.test(t))continue;
      if(/^(19|20)\d{2}(-(19|20)?\d{2})?$/.test(t))continue;
      if(/^\d{11,14}$/.test(t)){add(t,3,'upc');continue}
      let s=2;if(/[A-Z]/.test(t)&&/\d/.test(t))s+=2;if(/-/.test(t))s+=1;if(t.length>=5&&t.length<=12)s+=1;
      add(t,s,'part');
    }
  }
  return [...out.values()].sort((a,b)=>b.score-a.score||b.norm.length-a.norm.length).slice(0,10);
}

/* ---------- CSV (supplier price lists) ---------- */
function parseCSV(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=[',','\t',';','|'].map(d=>[d,first.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
  const rows=[];let row=[],cur='',q=false;
  const endRow=()=>{row.push(cur);cur='';if(row.some(c=>c.trim()!==''))rows.push(row);row=[]};
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;endRow()}
    else cur+=ch;
  }
  if(cur!==''||row.length)endRow();
  return rows;
}
function guessColumns(header){
  const f=re=>header.findIndex(h=>re.test(String(h).trim()));
  return {number:f(/part\s*(no|num|#)|^part$|item\s*(no|num|#)|sku|^number$|^p\/?n$|^item$/i),
    desc:f(/desc|name|title/i),cost:f(/cost|net|dealer|wholesale|your\s*price/i),
    list:f(/list|retail|msrp|^price$/i),brand:f(/brand|mfr|manufact|^line$/i)};
}
function csvOut(rows){return rows.map(r=>r.map(v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(',')).join('\n')}

/* ---------- money ---------- */
const priceFromCost=(cost,markupPct)=>r2(num(cost)*(1+num(markupPct)/100));
function jobTotals(j,st,c){
  let labor=0,parts=0,hours=0;
  for(const l of j.labor||[]){labor+=num(l.hours)*num(l.rate);hours+=num(l.hours)}
  for(const p of j.parts||[])parts+=num(p.qty)*num(p.price);
  labor=r2(labor);parts=r2(parts);
  const rate=c&&c.taxExempt?0:num(st.taxRate)/100;
  const tax=r2((parts+(st.laborTaxable?labor:0))*rate);
  return {labor,parts,tax,hours:r2(hours),total:r2(labor+parts+tax)};
}

/* ---------- service history + reminders ---------- */
function lastMileage(vehicleId,jobs){
  let best=null;
  for(const j of jobs)if(j.vehicleId===vehicleId)for(const k of [j.mileageIn,j.mileageOut]){
    const v=num(k);if(k!==''&&k!=null&&v>0&&(best==null||v>best))best=v;
  }
  return best;
}
function remState(r,mileage,todayStr){
  const dd=r.dueDate?daysBetween(todayStr,r.dueDate):null;
  const dm=r.dueMiles!=null&&mileage!=null?r.dueMiles-mileage:null;
  if((dd!=null&&dd<0)||(dm!=null&&dm<=0))return 'overdue';
  if((dd!=null&&dd<=30)||(dm!=null&&dm<=500))return 'soon';
  return 'ok';
}
function parseReminderTypes(text){
  return String(text).split(/\r?\n/).map(l=>l.split('|').map(s=>s.trim())).filter(a=>a[0])
    .map(a=>({id:slug(a[0]),label:a[0],miles:a[1]?num(a[1]):0,months:a[2]?num(a[2]):0}));
}
function parseChecklist(text){
  const items=[];let group='General';
  for(const raw of String(text).split(/\r?\n/)){
    const l=raw.trim();if(!l)continue;
    const m=l.match(/^([^:]{2,40}):\s*(.+)$/);
    if(m&&!m[2].includes(':')){group=m[1].trim();items.push({id:slug(group+'-'+m[2]),group,label:m[2].trim()})}
    else items.push({id:slug(group+'-'+l),group,label:l});
  }
  return items;
}

async function fileToCanvas(file,maxSide){
  maxSide=maxSide||3000;let bmp=null,src,w,h;
  try{if(window.createImageBitmap){try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await createImageBitmap(file)}}}catch(e){}
  if(bmp){src=bmp;w=bmp.width;h=bmp.height}
  else{src=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('That photo could not be opened. On iPhone, set Settings > Camera > Formats to Most Compatible.'))};im.src=u});
    w=src.naturalWidth;h=src.naturalHeight}
  const k=Math.min(1,maxSide/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));
  c.getContext('2d').drawImage(src,0,0,c.width,c.height);if(bmp&&bmp.close)bmp.close();return c;
}

/* ---------- camera scanning: VIN, odometer, part box ---------- */
const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';

const SCAN_TITLE={vin:'Scan VIN',odo:'Scan odometer',part:'Scan part box'};

 part:'Photograph the label on the part box that shows the part number. Barcodes are read too.'};

function drawScan(){

     <div class="btnrow"><button class="btn" data-act="scanRot" data-d="-90">Turn left</button><button class="btn" data-act="scanRot" data-d="90">Turn right</button><button class="btn pri" data-act="scanRead" ${SC.busy?'disabled':''}>Read again</button></div>`:''}

    ${SC.kind==='vin'?'<div class="sec"><label class="field"><span>Or type it</span><input id="scanType" type="text" maxlength="17" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="17 character VIN"></label><button class="btn" data-act="scanTyped">Use this VIN</button></div>':''}
    ${SC.kind==='odo'?'<div class="sec"><label class="field"><span>Or type it</span><input id="scanType" type="number" inputmode="numeric" placeholder="Miles"></label><button class="btn" data-act="scanTyped">Use this reading</button></div>':''}

function showCanvas(readonly){
  const c=document.createElement('canvas'),src=SC.canvas,k=Math.min(1,900/src.width);
  c.width=Math.round(src.width*k);c.height=Math.round(src.height*k);
  const g=c.getContext('2d');
  const draw=()=>{g.drawImage(src,0,0,c.width,c.height);
    if(SC.region){const r=SC.region;g.strokeStyle='#ffb000';g.lineWidth=3;g.fillStyle='#ffb00033';
      const x=r.x*c.width,y=r.y*c.height,w=r.w*c.width,h=r.h*c.height;g.fillRect(x,y,w,h);g.strokeRect(x,y,w,h)}};
  draw();
  const pos=e=>{const b=c.getBoundingClientRect();return{x:Math.min(1,Math.max(0,(e.clientX-b.left)/b.width)),y:Math.min(1,Math.max(0,(e.clientY-b.top)/b.height))}};
  if(readonly)return c;
  c.onpointerdown=e=>{SC.drag=pos(e);c.setPointerCapture(e.pointerId)};
  c.onpointermove=e=>{if(!SC.drag)return;const p=pos(e),a=SC.drag;
    SC.region={x:Math.min(a.x,p.x),y:Math.min(a.y,p.y),w:Math.abs(p.x-a.x),h:Math.abs(p.y-a.y)};draw()};
  c.onpointerup=()=>{SC.drag=null;if(SC.region&&(SC.region.w<.03||SC.region.h<.03)){SC.region=null;draw()}};
  return c;
}
async function loadScanFile(file){

  try{SC.canvas=await fileToCanvas(file,2400)}catch(e){SC.msg=e.message;SC.step='pick';drawScan();return}
  SC.orig=SC.canvas;SC.msg='';
  if(SC.kind==='vin'||SC.kind==='odo'){SC.step='crop';drawScan();return}

}
function rotateCanvas(c,deg){

  o.width=sw?c.height:c.width;o.height=sw?c.width:c.height;const g=o.getContext('2d');
  g.translate(o.width/2,o.height/2);g.rotate(deg*Math.PI/180);g.drawImage(c,-c.width/2,-c.height/2);return o;
}
ACT.scanClose=()=>closeScan();
ACT.scanClear=()=>{SC.region=null;drawScan()};
ACT.zoomIn=()=>{const V=SC.cv;if(V)V.zoomAt(V.W/2,V.H/2,1.6)};
ACT.zoomOut=()=>{const V=SC.cv;if(V)V.zoomAt(V.W/2,V.H/2,1/1.6)};

  if(SC.step==='crop'&&SC.cv){const sh=$('#shot');if(sh){sh.innerHTML='';startCropView(sh);return}}
  drawScan()};
ACT.scanRead=()=>runScan();
ACT.scanPick=b=>{const c=SC.cands[+b.dataset.i];const cb=SC.cb;closeScan();if(cb)cb(c.value,c)};

  const el=$('#scanType'),v=el.value.trim();if(!v)return;
  let out=v;
  if(SC.kind==='vin'){out=cleanVin(v);if(out.length!==17){SC.msg='A VIN has 17 characters. This has '+out.length+'.';drawScan();return}}
  if(SC.kind==='odo'){out=String(Math.round(num(v)))}

/* ----- image preprocessing (tuned on real VIN photos; see the scanner test page) ----- */
function prep(src,region,mode,rot,o){
  rot=rot||0;o=o||{};
  const r=region?{x:Math.round(region.x*src.width),y:Math.round(region.y*src.height),w:Math.max(8,Math.round(region.w*src.width)),h:Math.max(8,Math.round(region.h*src.height))}:{x:0,y:0,w:src.width,h:src.height};
  const long=Math.max(r.w,r.h),scale=Math.min(4,(o.size||1200)/long);
  const uw=Math.max(1,Math.round(r.w*scale)),uh=Math.max(1,Math.round(r.h*scale)),swap=Math.abs(rot)===90;
  const fw=swap?uh:uw,h=swap?uw:uh,w=Math.max(8,Math.round(fw*(1-2*(o.trim||0))));
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const g=c.getContext('2d',{willReadFrequently:true});g.imageSmoothingQuality='high';
  g.save();g.translate(w/2,h/2);g.rotate(rot*Math.PI/180);g.drawImage(src,r.x,r.y,r.w,r.h,-uw/2,-uh/2,uw,uh);g.restore();
  const im=g.getImageData(0,0,w,h),d=im.data,n=w*h,gray=new Uint8ClampedArray(n),hist=new Uint32Array(256);
  for(let i=0,p=0;i<n;i++,p+=4){const v=(d[p]*299+d[p+1]*587+d[p+2]*114)/1000|0;gray[i]=v;hist[v]++}
  let lo=0,hi=255,acc=0;while(lo<255&&(acc+=hist[lo])<n*.02)lo++;acc=0;while(hi>0&&(acc+=hist[hi])<n*.02)hi--;
  const span=Math.max(1,hi-lo);for(let i=0;i<n;i++)gray[i]=(gray[i]-lo)*255/span;
  let out=gray;
  if(mode==='invert')out=gray.map(v=>255-v);
  if(mode==='adaptive')out=adaptiveT(gray,w,h);
  if(mode==='sharp')out=boxSharpen(gray,w,h);
  for(let i=0,p=0;i<n;i++,p+=4){const v=out[i];d[p]=d[p+1]=d[p+2]=v;d[p+3]=255}
  g.putImageData(im,0,0);
  /* margin in the border colour: the OCR engine misreads characters that touch the edge */
  let ring=0,cnt=0;
  for(let x=0;x<w;x++){ring+=out[x]+out[(h-1)*w+x];cnt+=2}
  for(let y=0;y<h;y++){ring+=out[y*w]+out[y*w+w-1];cnt+=2}
  const fill=Math.round(ring/cnt),pad=Math.max(20,Math.round(Math.min(w,h)*.2));
  const pc=document.createElement('canvas');pc.width=w+2*pad;pc.height=h+2*pad;
  const pg=pc.getContext('2d');pg.fillStyle='rgb('+fill+','+fill+','+fill+')';pg.fillRect(0,0,pc.width,pc.height);pg.drawImage(c,pad,pad);
  return pc;
}
function boxSharpen(gray,w,h){
  const out=new Uint8ClampedArray(w*h);
  for(let y=0;y<h;y++){const y0=Math.max(0,y-2),y1=Math.min(h-1,y+2);
    for(let x=0;x<w;x++){const x0=Math.max(0,x-2),x1=Math.min(w-1,x+2);let s=0;
      for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++)s+=gray[yy*w+xx];
      const m=s/((x1-x0+1)*(y1-y0+1));out[y*w+x]=gray[y*w+x]+2*(gray[y*w+x]-m)}}
  return out;
}
function adaptiveT(gray,w,h){
  const r=Math.max(8,Math.round(Math.max(w,h)/30)),W=w+1,I=new Uint32Array(W*(h+1));
  for(let y=0;y<h;y++){let row=0;for(let x=0;x<w;x++){row+=gray[y*w+x];I[(y+1)*W+x+1]=I[y*W+x+1]+row}}
  const out=new Uint8ClampedArray(w*h);
  for(let y=0;y<h;y++){const y0=Math.max(0,y-r),y1=Math.min(h,y+r+1);
    for(let x=0;x<w;x++){const x0=Math.max(0,x-r),x1=Math.min(w,x+r+1),area=(x1-x0)*(y1-y0),sum=I[y1*W+x1]-I[y0*W+x1]-I[y1*W+x0]+I[y0*W+x0];
      out[y*w+x]=gray[y*w+x]*area<sum*.92?0:255}}
  return out;
}

/* ----- OCR engine ----- */
async function getWorker(whitelist,psm){
  if(!window.Tesseract)await loadScript(TESS_URL);
  if(!tessWorker){tessWorker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text'&&SC.busy){const b=document.querySelector('#scan .bar i');if(b)b.style.width=Math.round(SC.pct+(100-SC.pct)*m.progress*.0)+'%'}}})}
  if(tessWL!==whitelist+'|'+psm){await tessWorker.setParameters({tessedit_char_whitelist:whitelist,tessedit_pageseg_mode:String(psm)});tessWL=whitelist+'|'+psm}
  return tessWorker;
}
async function ocr(canvas,whitelist,psm){const w=await getWorker(whitelist,psm);const r=await w.recognize(canvas);return r.data.text||''}

/* ----- barcodes ----- */
async function readBarcodes(canvas){
  const found=[];
  try{if('BarcodeDetector' in window){const bd=new BarcodeDetector();const r=await bd.detect(canvas);r.forEach(x=>found.push(x.rawValue))}}catch(e){}
  if(found.length)return found;
  try{
    if(!window.ZXing)await loadScript(ZX_URL);
    const hints=new Map();hints.set(ZXing.DecodeHintType.TRY_HARDER,true);
    const reader=new ZXing.MultiFormatReader();reader.setHints(hints);
    for(const rot of [0,90]){
      const c=rot?rotateCanvas(canvas,rot):canvas,k=Math.min(1,1600/Math.max(c.width,c.height)),s=document.createElement('canvas');
      s.width=Math.round(c.width*k);s.height=Math.round(c.height*k);s.getContext('2d').drawImage(c,0,0,s.width,s.height);
      try{const src=new ZXing.HTMLCanvasElementLuminanceSource(s),bmp=new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
        found.push(reader.decode(bmp).getText());break}catch(e){}
    }
  }catch(e){}
  return found;
}

/* ----- run ----- */
function setProg(p,msg){SC.pct=p;if(msg!=null)SC.msg=msg;const b=document.querySelector('#scan .bar i'),m=$('#scanMsg');if(b)b.style.width=p+'%';if(m&&msg!=null)m.textContent=msg}
async function runScan(){
  if(!SC.canvas||SC.busy)return;
  SC.busy=true;SC.step='read';SC.cands=[];SC.msg='Reading...';SC.pct=3;drawScan();
  const kind=SC.kind;
  try{
    let cands=[];
    const region=SC.region;
    const regionCanvas=()=>{if(!region)return SC.canvas;return prep(SC.canvas,region,'plain',0,{size:Math.min(1800,Math.max(SC.canvas.width,SC.canvas.height)),trim:0})};
    if(kind!=='odo'){
      setProg(6,'Looking for a barcode...');
      const codes=await readBarcodes(regionCanvas());
      for(const t of codes){
        if(kind==='vin'){const v=vinFromBarcode(t);if(v)cands.push({value:v,label:v,note:(checkDigitOK(v)?'Barcode, check digit OK':'Barcode'),score:100})}
        else{const n=String(t).trim();if(n)cands.push({value:n,label:n,note:'Barcode on box',score:60,kind:/^\d{11,14}$/.test(n)?'upc':'part'})}
      }
      if(kind==='vin'&&cands.length){finishScan(cands);return}
    }
    const asp=region?(region.h*SC.canvas.height)/(region.w*SC.canvas.width):SC.canvas.height/SC.canvas.width;
    if(kind==='vin')cands=cands.concat(await scanVin(region,asp));
    else if(kind==='odo')cands=await scanOdo(region);
    else cands=cands.concat(await scanPart(region));
    finishScan(cands);
  }catch(e){SC.busy=false;SC.step='result';SC.msg='Reading failed: '+(e&&e.message||e)+' The reader needs internet the first time. You can type it instead.';drawScan()}
}
function finishScan(cands){
  SC.busy=false;SC.pct=0;SC.step='result';
  const seen=new Set();SC.cands=cands.filter(c=>!seen.has(c.value)&&seen.add(c.value)).sort((a,b)=>(b.score||0)-(a.score||0)).slice(0,6);
  SC.msg=SC.cands.length?'Tap the correct reading. If none are right, box the text and read again, or type it.':'Nothing readable found. Get closer, avoid glare, box just the text, or turn the photo.';
  drawScan();
}
async function scanVin(region,asp){
  const rots=asp>1.6?[-90,90,0]:[0,-90,90];
  const BASE=[{mode:'plain',size:1200,trim:.04,psm:7},{mode:'sharp',size:1200,trim:.04,psm:11},{mode:'plain',size:800,trim:.04,psm:11},
    {mode:'sharp',size:800,trim:0,psm:11},{mode:'adaptive',size:1200,trim:.04,psm:11},{mode:'invert',size:1200,trim:.04,psm:7}];
  const EXTRA=[{mode:'plain',size:1800,trim:.04,psm:11},{mode:'sharp',size:600,trim:.04,psm:11},{mode:'plain',size:800,trim:0,psm:7},{mode:'adaptive',size:800,trim:.04,psm:11},
    {mode:'sharp',size:1800,trim:.04,psm:7},{mode:'plain',size:1000,trim:.02,psm:11},{mode:'adaptive',size:1600,trim:0,psm:11},{mode:'invert',size:800,trim:0,psm:11}];
  const list=[];rots.forEach((rot,i)=>{for(const p of (i===0?BASE.concat(EXTRA):BASE.slice(0,2)))list.push({...p,rot,psm:(!region&&p.psm===7)?11:p.psm})});
  const wl='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const votes=new Map();let partial='',texts=[];
  const vote=(vin,note)=>{const c=votes.get(vin);if(c)c.n++;else votes.set(vin,{n:1,note})};
  for(let i=0;i<list.length;i++){
    const p=list[i];setProg(8+Math.round(i/list.length*90),'Reading VIN... pass '+(i+1)+' of '+list.length);
    const c=prep(SC.canvas,region,p.mode,p.rot,{size:p.size,trim:p.trim});
    for(const psm of [p.psm]){
      const txt=await ocr(c,wl,psm);texts.push(txt);
      const cs=candidatesFromText(txt);
      const ok=cs.filter(x=>x.valid&&plausible(x.vin));
      if(ok.length)return ok.map(x=>({value:x.vin,label:x.vin,note:'Check digit OK',score:90}));
      for(const x of cs)for(const r of repairs(x.vin))vote(r.vin,'Fixed '+r.from+' to '+r.to+', check digit OK');
      const pf=partialFromText(txt);if(pf.length>partial.length)partial=pf;
    }
    if([...votes.values()].some(v=>v.n>=3))break;
  }
  /* a single-character repair can pass the check digit by luck (about 1 in 11), so only repairs seen three or more times are offered, and they are always marked verify */
  const rep=[...votes.entries()].sort((a,b)=>b[1].n-a[1].n);
  const out=rep.filter(([,v])=>v.n>=3).slice(0,3).map(([vin,v])=>({value:vin,label:vin,note:v.note+' (verify)',score:60}));
  if(!out.length){
    const all=texts.flatMap(t=>candidatesFromText(t)).filter(x=>x.vin);
    if(rep.length)out.push({value:rep[0][0],label:rep[0][0],note:'Unsure. Verify each character.',score:30});
    else if(all.length)out.push({value:all[0].vin,label:all[0].vin,note:'Check digit failed. Verify each character.',score:30});
    else if(partial)out.push({value:partial,label:partial,note:'Partial read ('+partial.length+' of 17)',score:10,partial:true});}
  return out;
}
async function scanOdo(region){
  const found=new Map();
  const modes=[['plain',0],['sharp',0],['adaptive',0],['invert',0]];
  for(let i=0;i<modes.length;i++){
    setProg(8+Math.round(i/modes.length*90),'Reading odometer...');
    const c=prep(SC.canvas,region,modes[i][0],0,{size:900,trim:0});
    const txt=await ocr(c,'0123456789,. ',11);
    for(const x of odoCandidates(txt)){const cur=found.get(x.miles);if(cur)cur.score+=x.score;else found.set(x.miles,{...x})}
    const top=[...found.values()].sort((a,b)=>b.score-a.score)[0];if(top&&top.score>=6)break;
  }
  return [...found.values()].filter(x=>x.miles>=100).map(x=>({value:String(x.miles),label:fmtNum(x.miles)+' mi',note:x.score>=6?'Seen more than once':'',score:x.score}));
}
async function scanPart(region){
  const out=new Map();
  const variants=[['plain',6],['sharp',6],['plain',11],['sharp',11]];
  for(let i=0;i<variants.length;i++){
    setProg(20+Math.round(i/variants.length*75),'Reading label...');
    const c=prep(SC.canvas,region,variants[i][0],0,{size:1600,trim:0});
    const txt=await ocr(c,'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-./:#$ ',variants[i][1]);
    for(const x of partCandidates(txt)){const cur=out.get(x.norm);if(cur)cur.score+=x.score;else out.set(x.norm,{...x})}
  }
  return [...out.values()].map(x=>({value:x.text,label:x.text,note:x.kind==='upc'?'Barcode number (UPC)':(x.score>=12?'Looks like a part number':''),score:x.score+(x.kind==='upc'?-2:0),kind:x.kind}));
}

/* ----- VIN scan screens: take photo, crop, read, confirm ----- */
function cropRegion(src,r){
  const x=Math.round(r.x*src.width),y=Math.round(r.y*src.height),w=Math.max(8,Math.round(r.w*src.width)),h=Math.max(8,Math.round(r.h*src.height));
  const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(src,x,y,w,h,0,0,w,h);return c;
}

  const st=SC.step||'pick',top=SC.cands[0],vin=SC.kind==='vin';
  const T=vin?{title:'Scan VIN',what:'the 17 characters of the VIN',pick:'Photograph the VIN on the windshield (lower driver side) or the door post sticker. The camera shows a box. Fit the VIN inside it.',
     ph:'17 character VIN',inp:'type="text" maxlength="17" autocapitalize="characters" autocomplete="off" spellcheck="false"',lab:'VIN',acc:'Accept VIN',use:'Use this VIN',
     fmt:"this.value=cleanVin(this.value);document.getElementById('vinLen').textContent=this.value.length+'/17'",len:v=>v.length+'/17',turn:' Use Turn if the VIN is sideways.'}
   :{title:'Scan odometer',what:'the odometer digits',pick:'Photograph the odometer display with the ignition on. The camera shows a box. Fit the digits inside it.',
     ph:'Miles',inp:'type="text" inputmode="numeric" autocomplete="off"',lab:'Mileage',acc:'Accept mileage',use:'Use this reading',
     fmt:"this.value=this.value.replace(/\\D/g,'')",len:()=>'',turn:''};
  const camOK=!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
  const retake=camOK?'<button class="btn" data-act="scanCam">Retake photo</button>':null;
  const files=(lbl,pri)=>`<label class="btn ${pri?'pri':''}" style="text-align:center;cursor:pointer">${lbl}<input id="scanFile" type="file" accept="image/*" capture="environment" hidden></label><label class="btn" style="text-align:center;cursor:pointer">Choose from library<input id="scanFile2" type="file" accept="image/*" hidden></label>`;
  let body='';
  if(st==='pick')body=`<p class="sub">${T.pick}</p><div class="btnrow">${camOK?'<button class="btn pri" data-act="scanCam">Take photo</button>'+files('Use phone camera app'):files('Take photo',1)}</div>
    <div class="sec"><label class="field"><span>Or type it</span><input id="scanType" ${T.inp} placeholder="${T.ph}"></label><button class="btn" data-act="scanTyped">${T.use}</button></div>`;
  if(st==='crop')body=`<p class="sub"><b>Crop to the ${vin?'VIN':'digits'}.</b> Pinch or use + and - to zoom, drag the photo to move it, and drag the white corners to fit the box around ${T.what}.${T.turn}</p>
    <div class="cropv" id="shot"></div>
    <div class="btnrow tight"><button class="btn sm" data-act="zoomOut" aria-label="Zoom out">&minus;</button><button class="btn sm" data-act="zoomFit">Fit</button><button class="btn sm" data-act="zoomIn" aria-label="Zoom in">+</button><button class="btn sm" data-act="scanRot" data-d="-90" aria-label="Turn left">&#8634; Turn</button><button class="btn sm" data-act="scanRot" data-d="90" aria-label="Turn right">Turn &#8635;</button></div>
    <button class="btn pri" data-act="scanAccept">Accept crop</button>
    <button class="linkbtn" data-act="scanRetake">Start over with a new photo</button>`;
  if(st==='read')body=`<div class="shot" id="shot"></div><div class="bar"><i style="width:${SC.pct}%"></i></div><div id="scanMsg" class="sub" role="status" aria-live="polite">${esc(SC.msg)}</div>`;
  if(st==='result')body=`<div class="shot" id="shot"></div>
    <div id="scanMsg" class="sub" role="status" aria-live="polite">${top?(top.partial?'Only part of the VIN was read. Fix it below.':top.score>=(vin?70:6)?'Read. Check it against the photo, then accept.':'Check it against the photo before accepting.'):esc(SC.msg)}</div>
    <label class="field"><span>${T.lab} <b id="vinLen" class="num">${top?T.len(top.value):''}</b></span><input id="scanType" ${T.inp} value="${esc(top?top.value:'')}" style="font-family:var(--f-mono);font-size:18px;letter-spacing:.05em" oninput="${T.fmt}"></label>
    ${SC.cands.length>1?`<div class="sub">Other readings:</div>${SC.cands.slice(1).map((c,i)=>`<button class="cand" data-act="scanFill" data-i="${i+1}"><b>${esc(c.label)}</b><span class="sub">${esc(c.note||'')}</span></button>`).join('')}`:''}

  if(st==='cam')body=`<div class="camv" id="camv"><video playsinline muted autoplay></video><div class="camframe" id="camframe"></div><div class="camrot">Turn your phone upright (portrait) to take the photo</div></div>
    <p class="sub">Hold the phone upright and line up ${T.what} inside the box so the text is level and fills it. Tap the screen to focus.</p>
    <button class="btn pri camshot" data-act="camShot">Take photo</button><button class="btn" data-act="camCancel">Cancel</button>`;

  if(st==='cam')camStart();

/* ----- live camera with a rounded guide box: hold the phone upright, fit the text in the box ----- */
function camStopOnly(){if(SC.stream){try{SC.stream.getTracks().forEach(t=>t.stop())}catch(e){}SC.stream=null}}
function camStop(){if(SC.stream){try{SC.stream.getTracks().forEach(t=>t.stop())}catch(e){}SC.stream=null}}
function camLayout(){
  const box=$('#camv'),f=$('#camframe');if(!box||!f)return;
  const cw=box.clientWidth,ch=box.clientHeight,asp=SC.kind==='vin'?4.6:3;
  let fw=cw*.92,fh=fw/asp;if(fh>ch*.8){fh=ch*.8;fw=fh*asp}
  const x=(cw-fw)/2,y=(ch-fh)/2;f.style.cssText=`left:${x}px;top:${y}px;width:${fw}px;height:${fh}px`;
  SC.frame={x,y,w:fw,h:fh,cw,ch};
}
async function camStart(){
  const v=$('#camv video');if(!v)return;
  try{
    const vc=id=>({audio:false,video:Object.assign({width:{ideal:1920},height:{ideal:1080}},id?{deviceId:{exact:id}}:{facingMode:{ideal:'environment'}})});
    SC.stream=await navigator.mediaDevices.getUserMedia(vc(''));
    /* iPhone Pro: the main lens cannot focus up close, the ultra wide lens can. Always use it when the phone has one. */
    try{
      const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput'&&d.label);
      const ultra=devs.find(d=>/ultra/i.test(d.label)&&/back|rear|environment/i.test(d.label))||devs.find(d=>/ultra/i.test(d.label));
      if(ultra&&SC.stream.getVideoTracks()[0].getSettings().deviceId!==ultra.deviceId){camStopOnly();SC.stream=await navigator.mediaDevices.getUserMedia(vc(ultra.deviceId))}
    }catch(e){if(!SC.stream)SC.stream=await navigator.mediaDevices.getUserMedia(vc(''))}
    v.srcObject=SC.stream;v.setAttribute('playsinline','');await v.play();
    try{const t=SC.stream.getVideoTracks()[0],c=t.getCapabilities?t.getCapabilities():{};if(c.focusMode&&c.focusMode.includes('continuous'))await t.applyConstraints({advanced:[{focusMode:'continuous'}]})}catch(e){}
    camLayout();
  }catch(e){
    camStop();SC.step='pick';SC.msg='The camera could not open ('+(e&&e.name||'error')+'). Allow camera access for this site, or use the phone camera app.';drawScan();
  }
}
ACT.scanCam=()=>{SC.step='cam';SC.cands=[];SC.msg='';drawScan()};
ACT.camCancel=()=>{camStop();SC.step='pick';drawScan()};
ACT.camShot=()=>{
  if(matchMedia('(orientation:landscape) and (max-height:500px) and (pointer:coarse)').matches)return;
  const v=$('#camv video'),F=SC.frame;if(!v||!F||!v.videoWidth)return;
  const vw=v.videoWidth,vh=v.videoHeight,k=Math.max(F.cw/vw,F.ch/vh),ox=(vw*k-F.cw)/2,oy=(vh*k-F.ch)/2;
  const full=document.createElement('canvas'),m=Math.min(1,2400/Math.max(vw,vh));full.width=Math.round(vw*m);full.height=Math.round(vh*m);
  full.getContext('2d').drawImage(v,0,0,full.width,full.height);
  const pad=.04;let x0=(F.x+ox)/k/vw-pad*F.w/k/vw,y0=(F.y+oy)/k/vh-pad*F.h/k/vh,x1=(F.x+F.w+ox)/k/vw+pad*F.w/k/vw,y1=(F.y+F.h+oy)/k/vh+pad*F.h/k/vh;
  x0=Math.max(0,x0);y0=Math.max(0,y0);x1=Math.min(1,x1);y1=Math.min(1,y1);
  camStop();SC.orig=full;SC.canvas=cropRegion(full,{x:x0,y:y0,w:x1-x0,h:y1-y0});SC.region=null;SC.cands=[];SC.step='read';SC.msg='Reading...';drawScan();runScan();
};
ACT.scanAccept=()=>{
  const V=SC.cv;
  if(V&&SC.step==='crop'){const b=V.box;SC.canvas=cropRegion(SC.orig,{x:b.x0/V.iw,y:b.y0/V.ih,w:(b.x1-b.x0)/V.iw,h:(b.y1-b.y0)/V.ih})}
  else if(SC.region)SC.canvas=cropRegion(SC.orig,SC.region);else SC.canvas=SC.orig;
  SC.cv=null;SC.region=null;runScan();
};
ACT.scanRetake=()=>{SC.step='pick';SC.canvas=null;SC.orig=null;SC.cv=null;SC.cands=[];SC.msg='';drawScan()};
ACT.scanRecrop=()=>{SC.canvas=SC.orig;SC.region=null;SC.cands=[];SC.step='crop';drawScan()};
ACT.scanFill=b=>{const c=SC.cands[+b.dataset.i],el=$('#scanType');if(c&&el){el.value=c.value;const l=$('#vinLen');if(l&&SC.kind==='vin')l.textContent=c.value.length+'/17'}};

/* ----- crop viewer: pinch/wheel zoom, drag to pan, white box with four draggable corners (like the iPhone crop) ----- */
function startCropView(host){
  const src=SC.canvas,dpr=window.devicePixelRatio||1,W=host.clientWidth||340,H=Math.round(Math.max(260,Math.min(window.innerHeight*.44,460)));
  const cv=document.createElement('canvas');cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);
  cv.style.cssText='width:'+W+'px;height:'+H+'px;display:block;touch-action:none;background:#000';
  host.appendChild(cv);const g=cv.getContext('2d'),iw=src.width,ih=src.height,fit=Math.min(W/iw,H/ih);
  const V={W,H,iw,ih,fit,s:fit,ox:(W-iw*fit)/2,oy:(H-ih*fit)/2,box:{x0:0,y0:0,x1:iw,y1:ih}};
  const maxS=()=>Math.max(6,fit*14),clampS=s=>Math.min(maxS(),Math.max(fit*.8,s));
  const sx=x=>V.ox+x*V.s,sy=y=>V.oy+y*V.s,ix=px=>(px-V.ox)/V.s,iy=py=>(py-V.oy)/V.s;
  const corners=()=>{const b=V.box;return[[sx(b.x0),sy(b.y0)],[sx(b.x1),sy(b.y0)],[sx(b.x1),sy(b.y1)],[sx(b.x0),sy(b.y1)]]};
  function draw(){
    g.setTransform(dpr,0,0,dpr,0,0);g.fillStyle='#000';g.fillRect(0,0,W,H);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
    g.drawImage(src,V.ox,V.oy,iw*V.s,ih*V.s);
    const [[x0,y0],[x1,,],[,y1]]=[corners()[0],corners()[1],corners()[2]];
    const L=Math.max(0,Math.min(W,x0)),R=Math.max(0,Math.min(W,x1)),T=Math.max(0,Math.min(H,y0)),B=Math.max(0,Math.min(H,y1));
    g.fillStyle='rgba(0,0,0,.55)';g.fillRect(0,0,W,T);g.fillRect(0,B,W,H-B);g.fillRect(0,T,L,B-T);g.fillRect(R,T,W-R,B-T);
    g.strokeStyle='rgba(255,255,255,.4)';g.lineWidth=1;g.beginPath();
    for(let i=1;i<3;i++){g.moveTo(x0+(x1-x0)*i/3,y0);g.lineTo(x0+(x1-x0)*i/3,y1);g.moveTo(x0,y0+(y1-y0)*i/3);g.lineTo(x1,y0+(y1-y0)*i/3)}g.stroke();
    g.strokeStyle='#fff';g.lineWidth=1.5;g.strokeRect(x0,y0,x1-x0,y1-y0);
    const k=Math.min(24,(x1-x0)/2.5,(y1-y0)/2.5);g.lineWidth=5;g.lineCap='square';g.beginPath();
    g.moveTo(x0,y0+k);g.lineTo(x0,y0);g.lineTo(x0+k,y0);g.moveTo(x1-k,y0);g.lineTo(x1,y0);g.lineTo(x1,y0+k);
    g.moveTo(x1,y1-k);g.lineTo(x1,y1);g.lineTo(x1-k,y1);g.moveTo(x0+k,y1);g.lineTo(x0,y1);g.lineTo(x0,y1-k);g.stroke();
  }
  V.zoomAt=(px,py,f)=>{const s=clampS(V.s*f),ax=ix(px),ay=iy(py);V.s=s;V.ox=px-ax*s;V.oy=py-ay*s;draw()};
  V.fitView=()=>{V.s=fit;V.ox=(W-iw*fit)/2;V.oy=(H-ih*fit)/2;draw()};
  const pts=new Map();let mode='',cIdx=-1,last=null,pin=null;
  const loc=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  cv.onpointerdown=e=>{cv.setPointerCapture(e.pointerId);const p=loc(e);pts.set(e.pointerId,p);
    if(pts.size===2){const [a,b]=[...pts.values()],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;pin={d:Math.hypot(a[0]-b[0],a[1]-b[1])||1,s:V.s,ax:ix(mx),ay:iy(my)};mode='pinch';return}
    const cs=corners();cIdx=-1;let best=34;cs.forEach((c,i)=>{const d=Math.hypot(c[0]-p[0],c[1]-p[1]);if(d<best){best=d;cIdx=i}});
    if(cIdx>=0)mode='corner';else{mode='pan';last=p}};
  cv.onpointermove=e=>{if(!pts.has(e.pointerId))return;const p=loc(e);pts.set(e.pointerId,p);
    if(mode==='pinch'&&pts.size>=2){const [a,b]=[...pts.values()],mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,d=Math.hypot(a[0]-b[0],a[1]-b[1])||1;
      V.s=clampS(pin.s*d/pin.d);V.ox=mx-pin.ax*V.s;V.oy=my-pin.ay*V.s;draw();return}
    if(mode==='corner'){const b=V.box,m=18/V.s,x=Math.min(iw,Math.max(0,ix(p[0]))),y=Math.min(ih,Math.max(0,iy(p[1])));
      if(cIdx===0||cIdx===3)b.x0=Math.min(x,b.x1-m);else b.x1=Math.max(x,b.x0+m);
      if(cIdx===0||cIdx===1)b.y0=Math.min(y,b.y1-m);else b.y1=Math.max(y,b.y0+m);draw();return}
    if(mode==='pan'&&last){V.ox+=p[0]-last[0];V.oy+=p[1]-last[1];last=p;draw()}};
  const up=e=>{pts.delete(e.pointerId);if(pts.size<2&&mode==='pinch'){mode='';const r=[...pts.values()][0];if(r){mode='pan';last=r}}else if(!pts.size)mode=''};
  cv.onpointerup=up;cv.onpointercancel=up;
  cv.onwheel=e=>{e.preventDefault();const p=loc(e);V.zoomAt(p[0],p[1],Math.exp(-e.deltaY*.0015))};
  SC.cv=V;draw();
}

const fld=(label,inner,cls)=>`<label class="field ${cls||''}"><span>${label}</span>${inner}</label>`;
function inp(m,f,val,o){o=o||{};
  return `<input type="${o.type||'text'}" data-m="${m}" data-f="${f}" value="${esc(val)}"${o.ph?` placeholder="${esc(o.ph)}"`:''}${o.live?' data-live="1"':''}${o.redraw?' data-redraw="1"':''}${o.fmt?` data-fmt="${o.fmt}"`:''}${o.mode?` inputmode="${o.mode}"`:''}${o.cap?' autocapitalize="characters"':''}${o.max?` maxlength="${o.max}"`:''} autocomplete="off">`}
const area=(m,f,val,ph)=>`<textarea data-m="${m}" data-f="${f}" placeholder="${esc(ph||'')}">${esc(val)}</textarea>`;
function hoursSel(m,val){
  const opts=[];for(let q=1;q<=64;q++)opts.push(q/4);
  const cur=String(val==null?'':val).trim(),has=cur&&opts.some(o=>String(o)===cur||o===num(cur));
  const lbl=h=>{const w=Math.floor(h),f=h-w,fr={0:'',0.25:'1/4',0.5:'1/2',0.75:'3/4'}[f];return (w?w+(fr?' ':''):'')+(fr||'')+(h<=1?' hr':' hrs')};
  return `<select data-m="${m}" data-f="hours" data-live="1" aria-label="Hours">${cur?'':'<option value="" selected>Select</option>'}${cur&&!has?`<option value="${esc(cur)}" selected>${esc(cur)} hrs</option>`:''}${opts.map(o=>`<option value="${o}" ${cur&&num(cur)===o?'selected':''}>${lbl(o)}</option>`).join('')}</select>`;
}

async function decodeVin(vin){
  try{const ctl=new AbortController();const t=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch('https://vpic.nhtsa.dot.gov/api/vehicles/DecodeVinValues/'+encodeURIComponent(vin)+'?format=json',{signal:ctl.signal});clearTimeout(t);
    const x=(await r.json()).Results[0];if(!x||!x.Make)return null;
    const tc=s=>String(s||'').length<=3?String(s||''):String(s).toLowerCase().replace(/\b[a-z]/g,m=>m.toUpperCase());
    return{year:x.ModelYear||'',make:tc(x.Make),model:x.Model||'',trim:x.Trim||x.Series||''};
  }catch(e){return null}
}
const findCustomers=q=>{
  q=String(q||'').trim().toLowerCase();const qd=q.replace(/\D/g,'');
  return S.customers.filter(c=>{if(!q)return true;
    if(c.name.toLowerCase().includes(q))return true;if(qd.length>=3&&String(c.phone).replace(/\D/g,'').includes(qd))return true;
    return S.vehicles.some(v=>v.customerId===c.id&&[v.plate,v.vin,v.make,v.model].join(' ').toLowerCase().includes(q))}).sort((a,b)=>a.name.localeCompare(b.name));
};

function njFilter(){const e=$('#njList');if(e)e.innerHTML=njList($('#njQ').value)}
ACT.njPickCust=b=>{NJ.customerId=b.dataset.id;NJ.lockCust=true;sheet(njVehiclesSheet)};

ACT.njNewCust=()=>sheet(()=>shHead('New customer')+`<div class="sheet-b">${fld('Name',inp('nj','cname',NJ.cname||''))}${fld('Phone',inp('nj','cphone',NJ.cphone||'',{type:'tel',fmt:'phone'}))}

function makeJob(vid){

/* ---------- Parts: form, lookup, add to job ---------- */
let PF={};
const findPart=s=>{const n=normPart(s);if(!n)return null;return S.parts.find(p=>normPart(p.number)===n||(p.upc&&normPart(p.upc)===n))||null};
function partForm(){
  if(num(PF.cost)>0&&!String(PF.price).trim())PF.price=String(priceFromCost(PF.cost,S.settings.partsMarkup));
  const adm=isAdmin();
  return shHead(PF.id?'Edit part':'New part')+`<div class="sheet-b">
  <div class="btnrow"><button class="btn" data-act="pfScan">Scan box</button></div>
  ${fld('Part number',inp('pf','number',PF.number||'',{cap:1}))}${fld('Description',inp('pf','desc',PF.desc||''))}
  <div class="g2">${fld('Brand',inp('pf','brand',PF.brand||''))}${fld('Supplier',inp('pf','supplier',PF.supplier||''))}</div>
  <div class="g2 price">${fld('Your cost',inp('pf','cost',PF.cost||'',{mode:'decimal',redraw:1}))}${fld('Customer price',inp('pf','price',PF.price||'',{mode:'decimal'}))}</div>
  <button class="linkbtn price" data-act="pfCalc">Set price to cost + ${num(S.settings.partsMarkup)}%</button>
  ${fld('Barcode (UPC)',inp('pf','upc',PF.upc||''))}
  <button class="btn pri" data-act="pfSave">${PF.jobId?'Save and add to job':'Save part'}</button>
  ${PF.id&&adm?'<button class="btn bad" data-act="pfDelete">Delete part</button>':''}</div>`}
ACT.pfScan=()=>startScan('part',(v,c)=>{if(c&&c.kind==='upc')PF.upc=v;else PF.number=v;refresh()});
ACT.pfCalc=()=>{if(num(PF.cost)>0){PF.price=String(priceFromCost(PF.cost,S.settings.partsMarkup));refresh()}};
function addLineFromPart(jobId,p,qty){
  const j=job(jobId);j.parts.push({id:uid(),partId:p.id,number:p.number,desc:p.desc,qty:String(qty||1),cost:p.cost||'',price:p.price||''});
  p.uses=(p.uses||0)+1;p.last=today();persistNow();
}
ACT.pfSave=()=>{
  if(!String(PF.number||'').trim()&&!String(PF.desc||'').trim()){toast('Enter a part number or description');return}
  let p=PF.id?S.parts.find(x=>x.id===PF.id):findPart(PF.number);
  const data={number:String(PF.number||'').trim(),desc:PF.desc||'',brand:PF.brand||'',supplier:PF.supplier||'',cost:PF.cost||'',price:PF.price||'',upc:PF.upc||''};
  if(p)Object.assign(p,data);else{p={id:uid(),uses:0,last:'',...data};S.parts.push(p)}
  if(PF.jobId)addLineFromPart(PF.jobId,p,1);
  persistNow();popSheet();toast(PF.jobId?'Part added to job':'Part saved');
};
ACT.pfDelete=()=>{if(!confirm('Delete this part from the catalog?'))return;S.parts=S.parts.filter(x=>x.id!==PF.id);persistNow();popSheet()};
ACT.editPart=b=>{const p=S.parts.find(x=>x.id===b.dataset.id);PF={...p};sheet(partForm)};
ACT.newPart=()=>{PF={number:'',desc:'',brand:'',supplier:'',cost:'',price:'',upc:''};sheet(partForm)};
ACT.addPart=b=>{
  const jobId=b.dataset.id;
  sheet(()=>shHead('Add part')+`<div class="sheet-b">
   <button class="bigbtn" data-act="apScan" data-id="${jobId}">${ICON.cam}<div><b>Scan the part box</b><span class="sub">Reads the part number and barcode</span></div></button>
   <div class="card sec"><label class="field"><span>Type a part number</span><input id="apNum" type="text" autocapitalize="characters" autocomplete="off"></label><button class="btn pri" data-act="apType" data-id="${jobId}">Find part</button></div>
   <div class="sec"><h3>Or pick from your parts</h3><input id="apQ" type="search" placeholder="Search parts" oninput="apFilter('${jobId}')" autocomplete="off"><div id="apList" class="sec">${apList('',jobId)}</div></div></div>`);
};
function apList(q,jobId){q=q.trim().toLowerCase();
  let l=S.parts.filter(p=>!q||[p.number,p.desc,p.brand].join(' ').toLowerCase().includes(q));
  l=l.sort((a,b)=>String(b.last).localeCompare(String(a.last))).slice(0,25);
  return l.length?l.map(p=>`<button class="cand" data-act="apPick" data-id="${p.id}" data-job="${jobId}"><div><b>${esc(p.number)}</b><div class="sub">${esc(p.desc)}</div></div><span class="price">${p.price?money(num(p.price)):''}</span></button>`).join(''):'<div class="empty">No parts yet. Scan a box to add the first one.</div>'}
function apFilter(jobId){const e=$('#apList');if(e)e.innerHTML=apList($('#apQ').value,jobId)}
function resolvePart(jobId,value,kind){
  const p=findPart(value);stack.pop();
  if(p){addLineFromPart(jobId,p,1);drawSheet();render();toast('Added '+p.number+(p.price&&canSeePrices()?' at '+money(num(p.price)):''));return}
  PF={jobId,number:kind==='upc'?'':value,upc:kind==='upc'?value:'',desc:'',brand:'',supplier:'',cost:'',price:''};
  sheet(partForm);toast('New part. Add the description and cost once and it is remembered.');
}
ACT.apScan=b=>startScan('part',(v,c)=>resolvePart(b.dataset.id,v,c&&c.kind));
ACT.apType=b=>{const v=$('#apNum').value.trim();if(!v)return;resolvePart(b.dataset.id,v,'part')};
ACT.apPick=b=>{const p=S.parts.find(x=>x.id===b.dataset.id);stack.pop();addLineFromPart(b.dataset.job,p,1);drawSheet();render();toast('Added '+p.number)};

let curJob=null;

const photoBtns=(jobId,kind,ref,label)=>`<label class="btn sm" style="cursor:pointer">${label||'Take photo'}<input type="file" accept="image/*" capture="environment" hidden data-photo="${jobId}|${kind}|${ref||''}"></label><label class="btn sm" style="cursor:pointer">From library<input type="file" accept="image/*" multiple hidden data-photo="${jobId}|${kind}|${ref||''}"></label>`;

ACT.delPhoto=b=>{if(!confirm('Delete this photo?'))return;P=P.filter(x=>x.id!==b.dataset.id);idbDel(b.dataset.id);refresh()};

function jobSheet(id){
  const j=job(id);if(!j)return shHead('Job')+'<div class="sheet-b"><div class="empty">Job not found.</div></div>';
  const c=jobCust(j),v=jobVeh(j),px=canSeePrices(),adm=isAdmin(),last=v?vehMiles(v.id):null;
  const items=parseChecklist(S.settings.checklistText),ins=j.inspection.items;
  const cnt={bad:0,watch:0,ok:0};for(const k in ins)if(cnt[ins[k].r]!=null)cnt[ins[k].r]++;

  <div class="card sec">

    <div><b>${esc(vehTitle(v))}</b>${v&&v.trim?' '+esc(v.trim):''}<div class="vin">${esc(v?v.vin:'')}${v&&v.plate?' &middot; '+esc(v.plate):''}</div></div>

  ${!String(j.mileageIn).trim()?`<div class="banner"><span>Mileage not recorded yet.</span><button class="btn sm pri" data-act="scanOdo" data-id="${j.id}" data-f="mileageIn">Scan odometer</button></div>`:''}
  <div class="sec">${fld('Mileage',inp('job:'+j.id,'mileageIn',j.mileageIn,{mode:'numeric'}))}<button class="btn sm" data-act="scanOdo" data-id="${j.id}" data-f="mileageIn">${ICON.cam.replace('<svg','<svg width="16" height="16"')} Scan odometer</button>${last&&last!==num(j.mileageIn)?`<div class="sub">Last on file: ${fmtNum(last)}</div>`:''}</div>

    <div class="ctl">${fld('Hours',hoursSel('lab:'+j.id+':'+l.id,l.hours))}${fld('Rate',inp('lab:'+j.id+':'+l.id,'rate',l.rate,{mode:'decimal',live:1}),'price')}<div class="price num">${money(num(l.hours)*num(l.rate))}</div></div></div>`).join(''):'<div class="sub">No hours yet. Tap + Hours.</div>'}</div>

  </div>`;

ACT.scanOdo=b=>{const j=job(b.dataset.id),f=b.dataset.f;startScan('odo',v=>{j[f]=v;persistNow();refresh();toast('Mileage '+fmtNum(v)+' saved')})};
ACT.finishJob=b=>{const j=job(b.dataset.id);if(!j)return;j.status='ready';persistNow();popSheet();refresh();toast('Moved to Completed')};
ACT.setStatus=b=>{
  const j=job(b.dataset.id),s=b.dataset.s;
  if((s==='invoiced'||s==='paid')&&(isTech()||!canSeePrices())){toast('Only the office can invoice');return}
  j.status=s;
  if((s==='invoiced'||s==='paid')&&!j.invoice.no){j.invoice.no=S.nextInv++;j.invoice.date=today()}
  if(s==='paid'){j.invoice.paid=true;j.invoice.paidDate=today()}else if(s!=='paid'&&j.invoice.paid){j.invoice.paid=false;j.invoice.paidDate=''}
  persistNow();refresh();
};
ACT.toggleAssign=b=>{const j=job(b.dataset.id),s=b.dataset.s,i=j.assigned.indexOf(s);if(i<0)j.assigned.push(s);else j.assigned.splice(i,1);persistNow();refresh()};
ACT.addLabor=b=>{const j=job(b.dataset.id),m=me();j.labor.push({id:uid(),desc:'',hours:'',rate:String(S.settings.laborRate),by:m?m.id:'',date:today()});persistNow();refresh()};
ACT.delLabor=b=>{const j=job(b.dataset.id);j.labor=j.labor.filter(l=>l.id!==b.dataset.l);persistNow();refresh()};

ACT.delJob=b=>{if(!confirm('Delete this job and its photos? This cannot be undone.'))return;const id=b.dataset.id;
  P.filter(p=>p.jobId===id).forEach(p=>idbDel(p.id));P=P.filter(p=>p.jobId!==id);S.jobs=S.jobs.filter(j=>j.id!==id);persistNow();stack.length=0;drawSheet();render()};

/* ---------- Inspection ---------- */
ACT.openInsp=b=>sheet(()=>inspSheet(b.dataset.id));
function inspSheet(id){
  const j=job(id),items=parseChecklist(S.settings.checklistText),ins=j.inspection.items;let g='',h='';
  for(const it of items){
    if(it.group!==g){g=it.group;h+=`<div class="igrp">${esc(g)}</div>`}
    const r=(ins[it.id]||{}).r||'',ph=photosOf(id,'insp').filter(p=>p.refId===it.id);
    h+=`<div class="irow"><div class="t">${esc(it.label)}</div>
     <div class="seg3" role="group" aria-label="${esc(it.label)}">${[['ok','OK'],['watch','Watch'],['bad','Bad']].map(x=>`<button data-r="${x[0]}" aria-pressed="${r===x[0]}" data-act="inspSet" data-id="${id}" data-i="${it.id}" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>
     ${r==='watch'||r==='bad'?`${inp('insp:'+id+':'+it.id,'note',(ins[it.id]||{}).note||'',{ph:'Note'})}<div class="btnrow">${photoBtns(id,'insp',it.id,'Photo')}<button class="btn sm" data-act="inspToLine" data-id="${id}" data-i="${it.id}">Add to job as labor</button></div>`:''}
     ${photoGrid(ph)}</div>`;
  }
  return shHead('Inspection #'+j.no)+`<div class="sheet-b"><div class="btnrow"><button class="btn" data-act="inspAllOk" data-id="${id}">Mark unrated as OK</button><button class="btn pri" data-act="inspDone" data-id="${id}">${j.inspection.done?'Reopen':'Mark complete'}</button></div>${h}</div>`;
}
ACT.inspSet=b=>{const j=job(b.dataset.id),i=b.dataset.i,e=j.inspection.items[i]||(j.inspection.items[i]={r:'',note:''});e.r=e.r===b.dataset.v?'':b.dataset.v;persistNow();refresh()};
ACT.inspAllOk=b=>{const j=job(b.dataset.id);for(const it of parseChecklist(S.settings.checklistText)){const e=j.inspection.items[it.id]||(j.inspection.items[it.id]={r:'',note:''});if(!e.r)e.r='ok'}persistNow();refresh()};
ACT.inspDone=b=>{const j=job(b.dataset.id);j.inspection.done=!j.inspection.done;persistNow();refresh()};
ACT.inspToLine=b=>{const j=job(b.dataset.id),it=parseChecklist(S.settings.checklistText).find(x=>x.id===b.dataset.i),e=j.inspection.items[it.id]||{};
  j.labor.push({id:uid(),desc:it.label+(e.note?' - '+e.note:''),hours:'',rate:String(S.settings.laborRate),by:'',date:today()});persistNow();toast('Added to labor. Set the hours on the job.')};

/* ---------- Invoice document ---------- */
let DOC={};
ACT.openDoc=b=>{
  const j=job(b.dataset.id);
  if(!j.invoice.no){j.invoice.no=S.nextInv++;j.invoice.date=today()}
  persistNow();DOC={id:j.id};sheet(docSheet);render();
};
function docSheet(){
  const j=job(DOC.id),c=jobCust(j),v=jobVeh(j),tot=totalsOf(j),st=S.settings,inv=j.invoice;
  const rows=[...j.labor.filter(l=>l.desc||num(l.hours)).map(l=>`<tr><td>${esc(l.desc||'Labor')}</td><td class="r">${num(l.hours)} hr</td><td class="r">${money(num(l.rate))}</td><td class="r">${money(num(l.hours)*num(l.rate))}</td></tr>`),
    ...j.parts.map(l=>`<tr><td>${l.number?`<span class="mono">${esc(l.number)}</span> `:''}${esc(l.desc)}</td><td class="r">${num(l.qty)}</td><td class="r">${money(num(l.price))}</td><td class="r">${money(num(l.qty)*num(l.price))}</td></tr>`)].join('');
  return shHead('Invoice #'+inv.no)+`<div class="sheet-b">
  <div class="paper">
   <div class="meta" style="margin-top:0"><div><h1>${esc(st.shopName)}</h1><div>${esc(st.address)}${st.phone?'<br>'+esc(st.phone):''}</div></div>
    <div style="text-align:right"><h1>INVOICE</h1><div class="mono">#${inv.no}</div><div>${fmtDate(inv.date)}</div></div></div>
   <div class="meta"><div><b>Customer</b><br>${esc(c.name)}<br>${esc(c.phone)}${c.address?'<br>'+esc(c.address):''}</div>
    <div><b>Vehicle</b><br>${esc(vehTitle(v))} ${esc(v.trim||'')}<br><span class="mono">${esc(v.vin)}</span>${v.plate?'<br>Plate '+esc(v.plate):''}${j.mileageIn?'<br>Mileage '+fmtNum(num(j.mileageIn)):''}</div></div>
   ${j.concern?`<p><b>Concern:</b> ${esc(j.concern)}</p>`:''}
   <table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr></thead><tbody>${rows||'<tr><td colspan="4">No lines yet.</td></tr>'}</tbody></table>
   <div class="totals" style="margin-top:12px"><div>Labor <span>${money(tot.labor)}</span></div><div>Parts <span>${money(tot.parts)}</span></div><div>Tax${c.taxExempt?' (exempt)':' '+num(st.taxRate)+'%'} <span>${money(tot.tax)}</span></div><div class="grand">${inv.paid?'Total paid':'Total due'} <span>${money(tot.total)}</span></div></div>
   ${j.invNotes?`<p style="margin-top:12px">${esc(j.invNotes)}</p>`:''}
   <p style="margin-top:14px;color:var(--paper-muted)">${esc(st.invNote)}</p>
  </div>
  <div class="noprint sec">
   <div class="btnrow"><button class="btn" data-act="printDoc">Print or save PDF</button><button class="btn" data-act="copyDoc">Copy text</button><button class="btn" data-act="csvInvoice">Export CSV</button></div>
   <div class="card sec"><h3>Payment</h3>${inv.paid?`<div class="row"><span class="pill paid">Paid ${fmtDate(inv.paidDate)} ${esc(inv.method||'')}</span></div><button class="btn" data-act="unpay">Mark unpaid</button>`:
     `${fld('Method',`<select id="payM">${['Cash','Check','Card','Account'].map(m=>`<option>${m}</option>`).join('')}</select>`)}<button class="btn pri" data-act="markPaid">Mark paid</button>`}</div>
  </div></div>`;
}
const docText=j=>{const c=jobCust(j),v=jobVeh(j),tot=totalsOf(j),st=S.settings;
  const L=[st.shopName+' - Invoice #'+j.invoice.no,c.name+' - '+vehTitle(v),''];
  j.labor.filter(l=>l.desc||num(l.hours)).forEach(l=>L.push((l.desc||'Labor')+': '+money(num(l.hours)*num(l.rate))));
  j.parts.forEach(l=>L.push((l.number?l.number+' ':'')+l.desc+' x'+num(l.qty)+': '+money(num(l.qty)*num(l.price))));
  L.push('','Tax: '+money(tot.tax),'Total: '+money(tot.total));return L.join('\n')};
ACT.printDoc=()=>window.print();
ACT.copyDoc=()=>copyText(docText(job(DOC.id)));
ACT.csvInvoice=()=>{
  const j=job(DOC.id),c=jobCust(j),v=jobVeh(j),rows=[['Invoice','Date','Customer','VIN','Type','Part number','Description','Qty','Unit price','Amount']];
  j.labor.filter(l=>l.desc||num(l.hours)).forEach(l=>rows.push([j.invoice.no,j.invoice.date,c.name,v.vin,'Labor','',l.desc,num(l.hours),num(l.rate),r2(num(l.hours)*num(l.rate))]));
  j.parts.forEach(l=>rows.push([j.invoice.no,j.invoice.date,c.name,v.vin,'Part',l.number,l.desc,num(l.qty),num(l.price),r2(num(l.qty)*num(l.price))]));
  const t=totalsOf(j);rows.push([j.invoice.no,j.invoice.date,c.name,v.vin,'Tax','','Sales tax','','',t.tax]);
  saveFile('invoice-'+j.invoice.no+'.csv',csvOut(rows),'text/csv');
};
ACT.markPaid=()=>{const j=job(DOC.id),m=$('#payM');j.invoice.paid=true;j.invoice.paidDate=today();j.invoice.method=m?m.value:'';j.status='paid';persistNow();refresh()};
ACT.unpay=()=>{const j=job(DOC.id);j.invoice.paid=false;j.invoice.paidDate='';j.status='invoiced';persistNow();refresh()};
ACT.openVeh=b=>{if(b.dataset.id)sheet(()=>vehSheet(b.dataset.id))};

/* ---------- Previous work on a vehicle (read only, no prices) ---------- */
ACT.openHist=b=>sheet(()=>histSheet(b.dataset.id));
function histSheet(jobId){
  const cur=job(jobId),v=jobVeh(cur),items=parseChecklist(S.settings.checklistText);
  const js=S.jobs.filter(x=>x.vehicleId===cur.vehicleId&&x.id!==jobId).sort((a,b)=>b.created.localeCompare(a.created));
  return shHead('Previous work')+`<div class="sheet-b"><div class="card"><b>${esc(vehTitle(v))}</b><div class="vin">${esc(v.vin)}</div></div>
  ${js.length?js.map(x=>{
    const flags=Object.entries(x.inspection.items).filter(([k,e])=>e.r==='bad'||e.r==='watch').map(([k,e])=>{const it=items.find(i=>i.id===k);return `<li><span class="pill ${e.r}">${e.r==='bad'?'Bad':'Watch'}</span> ${esc(it?it.label:k)}${e.note?' - '+esc(e.note):''}</li>`}).join('');
    return `<div class="card sec"><div class="between"><div class="title-line">${fmtDate(x.created)}</div><span class="sub">${x.mileageIn?fmtNum(num(x.mileageIn))+' mi':''}</span></div>
     ${x.concern?`<div><b>Concern:</b> ${esc(x.concern)}</div>`:''}
     ${x.labor.length?`<div><b>Labor:</b> ${x.labor.map(l=>(l.desc?esc(l.desc)+' ':'')+(num(l.hours)?'('+num(l.hours)+' hr)':'')).join(', ')}</div>`:''}
     ${x.parts.length?`<div><b>Parts:</b> ${x.parts.map(p=>(p.number?esc(p.number)+' ':'')+esc(p.desc)+(num(p.qty)>1?' x'+num(p.qty):'')).join(', ')}</div>`:''}
     ${x.notes?`<div class="note">${esc(x.notes)}</div>`:''}
     ${flags?`<ul style="margin:0;padding-left:18px">${flags}</ul>`:''}</div>`}).join(''):'<div class="empty">No earlier jobs on this vehicle.</div>'}</div>`;
}

/* ---------- sign in ---------- */
function signIn(){
  stack.length=0;
  stack.push(()=>`<div class="sheet-h"><h2>Who is working?</h2></div><div class="sheet-b"><p class="sub">Pick your name. The shop can add or change names in Settings.</p>
   ${S.staff.filter(s=>s.active).map(s=>`<button class="cand" data-act="pickUser" data-id="${s.id}"><div class="row">${dotH(s)}<div><b style="font-family:var(--f-body)">${esc(s.name)}</b><div class="sub">${{admin:'Admin',office:'Office',tech:'Technician'}[s.role]}</div></div></div></button>`).join('')}<div class="sub" style="text-align:center;margin-top:14px">Version ${APP_VERSION}</div></div>`);

ACT.pickUser=b=>{localStorage.setItem(USERKEY,b.dataset.id);stack.length=0;drawSheet();render();toast('Signed in as '+me().name)};

/* ---------- shell ---------- */
const TABS=[['jobs','Jobs'],['customers','Customers'],['parts','Parts'],['needs','Shop needs'],['settings','Settings']];
function render(){
  const m=me();document.body.classList.toggle('tech',!canSeePrices());
  $('#who').innerHTML=m?dotH(m)+`<span>${esc(m.name)}</span>`:'Sign in';
  const needN=S.needs.filter(n=>!n.done).length;
  const tabs=isTech()?[['open','Open jobs'],['upcoming','Upcoming jobs'],['completed','Completed'],['needs','Shop needs']]:TABS;if(!tabs.some(t=>t[0]===ui.tab))ui.tab=tabs[0][0];
  $('#tabs').innerHTML=tabs.map(t=>`<button class="tab" role="tab" aria-selected="${ui.tab===t[0]}" data-act="tab" data-t="${t[0]}">${t[1]}${t[0]==='needs'&&needN?`<span class="n">${needN}</span>`:''}</button>`).join('');
  $('#searchrow').style.display=['jobs','open','upcoming','customers','parts'].includes(ui.tab)?'':'none';
  $('#q').placeholder={jobs:'Search jobs, customers, VIN, plate',open:'Search open jobs',upcoming:'Search upcoming jobs',customers:'Search customers',parts:'Search parts'}[ui.tab]||'Search';
  const fn={jobs:vJobs,open:vJobs,upcoming:vJobs,completed:vJobs,customers:vCustomers,parts:vParts,needs:vNeeds,settings:vSettings}[ui.tab];
  $('#view').innerHTML=fn();
}
ACT.tab=b=>{ui.tab=b.dataset.t;ui.q='';$('#q').value='';render();window.scrollTo(0,0)};
$('#q').addEventListener('input',e=>{ui.q=e.target.value;$('#view').innerHTML=({jobs:vJobs,open:vJobs,upcoming:vJobs,completed:vJobs,customers:vCustomers,parts:vParts}[ui.tab]||(()=>''))()});

/* ---------- Jobs ---------- */
const FILTERS=[['active','Active'],['upcoming','Upcoming'],['ready','Completed'],['unpaid','Unpaid'],['paid','Paid'],['all','All']];
function techSees(j){const m=me();return !isTech()||(m&&j.assigned.includes(m.id)&&['upcoming','open','ready'].includes(j.status))}
function jobMatch(j,f){
  const m=me();if(!techSees(j))return false;
  return {active:['upcoming','open','ready'].includes(j.status),upcoming:j.status==='upcoming',ready:j.status==='ready',unpaid:j.status==='invoiced',paid:j.status==='paid',all:true}[f];
}
function jobCard(j,px){const c=jobCust(j),v=jobVeh(j);return `<div class="card tap" data-act="openJob" data-id="${j.id}" role="button" tabindex="0">
    <div class="between"><div class="title-line">#${j.no} &middot; ${esc(c?c.name:'')}</div><span class="pill ${j.status}">${statusLabel(j.status)}</span></div>
    <div>${esc(vehTitle(v))}${v&&v.plate?' &middot; '+esc(v.plate):''}</div>
    ${j.concern?`<div class="sub">${esc(j.concern.slice(0,110))}</div>`:''}
    <div class="between" style="margin-top:6px"><div class="dots">${j.assigned.map(id=>dotH(staffOf(id))).join('')}</div><div class="sub">${fmtDate(j.created)}${px?' &middot; <b class="num price">'+money(totalsOf(j).total)+'</b>':''}</div></div></div>`}
function vJobs(){
  const q=ui.q.trim().toLowerCase(),px=canSeePrices();
  let l=S.jobs.filter(j=>techSees(j)&&(q?[jobCust(j)&&jobCust(j).name,jobVeh(j)&&[jobVeh(j).vin,jobVeh(j).plate,jobVeh(j).make,jobVeh(j).model].join(' '),'#'+j.no,j.concern].join(' ').toLowerCase().includes(q):(isTech()||jobMatch(j,ui.jobFilter))));
  l.sort((a,b)=>b.created.localeCompare(a.created));
  if(isTech()){
    const want=ui.tab==='upcoming'?'upcoming':ui.tab==='completed'?'ready':'open';l=l.filter(j=>j.status===want);
    return l.map(j=>jobCard(j,px)).join('')||`<div class="empty">${q?'No match.':ui.tab==='upcoming'?'Nothing assigned to you yet.':ui.tab==='completed'?'No completed jobs yet.':'No open jobs.'}</div>`;
  }
  return `${q?'':`<div class="chips" role="group" aria-label="Filter jobs">${FILTERS.map(f=>`<button class="chip" aria-pressed="${ui.jobFilter===f[0]}" data-act="jobFilter" data-f="${f[0]}">${f[1]}<span class="sub"> ${S.jobs.filter(j=>jobMatch(j,f[0])).length}</span></button>`).join('')}</div>`}
  ${l.length?l.map(j=>jobCard(j,px)).join(''):`<div class="empty">${q?'No match.':'Nothing here yet. Tap + New job to start one.'}</div>`}`;
}
ACT.jobFilter=b=>{ui.jobFilter=b.dataset.f;render()};
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.card.tap')){e.preventDefault();e.target.click()}});

  return `<div class="between"><h2>Customers</h2><button class="btn pri" data-act="newCust">+ Customer</button></div>
  ${l.length?l.map(c=>{const vs=S.vehicles.filter(v=>v.customerId===c.id),open=S.jobs.filter(j=>j.customerId===c.id&&['upcoming','open','ready'].includes(j.status)).length;
   return `<div class="card tap" data-act="openCust" data-id="${c.id}" role="button" tabindex="0"><div class="between"><div class="title-line">${esc(c.name)}</div>${open?`<span class="pill open">${open} open</span>`:''}</div>
    <div class="sub">${esc(c.phone)}${c.phone?' &middot; ':''}${vs.length} vehicle${vs.length===1?'':'s'}${vs.length?': '+esc(vs.slice(0,3).map(vehTitle).join(', ')):''}</div></div>`}).join(''):'<div class="empty">No customers yet.</div>'}`;

ACT.newCust=()=>{const c={id:uid(),name:'',phone:'',email:'',address:'',taxExempt:false,notes:''};S.customers.push(c);persistNow();sheet(()=>custSheet(c.id));render()};
ACT.openCust=b=>sheet(()=>custSheet(b.dataset.id));
function custSheet(id){

  ${fld('Address',inp('cust:'+id,'address',c.address))}

  <div class="sec"><h3>Vehicles <button class="btn sm" data-act="custAddVeh" data-id="${id}">+ Vehicle</button></h3>
