  <div class="sec"><h3>Job history</h3>${js.length?js.map(j=>`<button class="cand" data-act="openJob" data-id="${j.id}"><div><b style="font-family:var(--f-body)">#${j.no} ${fmtDate(j.created)}</b><div class="sub">${esc(vehTitle(jobVeh(j)))}</div></div><span class="pill ${j.status}">${statusLabel(j.status)}</span></button>`).join(''):'<div class="sub">No jobs yet.</div>'}</div>
  ${!js.length&&!vs.length?`<button class="btn bad" data-act="delCust" data-id="${id}">Delete customer</button>`:''}</div>`;

/* ---------- Parts ---------- */
let IMP={};
function vParts(){
  const q=ui.q.trim().toLowerCase(),l=S.parts.filter(p=>!q||[p.number,p.desc,p.brand,p.supplier,p.upc].join(' ').toLowerCase().includes(q)).sort((a,b)=>a.number.localeCompare(b.number)).slice(0,200);
  return `<div class="between"><h2>Parts <span class="sub">${S.parts.length}</span></h2><div class="btnrow" style="flex:none"><button class="btn sm" data-act="newPart">+ Part</button>${isAdmin()?'<label class="btn sm" style="cursor:pointer">Import price list<input type="file" accept=".csv,.txt,.tsv" hidden id="impFile"></label><button class="btn sm" data-act="exportParts">Export</button>':''}</div></div>
  ${l.length?l.map(p=>`<div class="card tap" data-act="editPart" data-id="${p.id}" role="button" tabindex="0"><div class="between"><div><span class="vin">${esc(p.number)}</span> <b>${esc(p.desc)}</b></div><span class="num price"><b>${p.price?money(num(p.price)):''}</b></span></div>
   <div class="sub">${esc([p.brand,p.supplier].filter(Boolean).join(' / '))}${p.uses?' &middot; used '+p.uses+'x':''}${p.cost&&isAdmin()?' &middot; cost '+money(num(p.cost)):''}</div>
   <div class="btnrow" style="margin-top:6px"><button class="btn sm" data-act="needFromPart" data-id="${p.id}">Add to shop needs</button></div></div>`).join(''):'<div class="empty">No parts yet. Parts are remembered the first time you add them to a job, or import a supplier price list.</div>'}`;
}
document.addEventListener('change',async e=>{
  if(e.target.id!=='impFile')return;const f=e.target.files[0];e.target.value='';if(!f)return;
  const rows=parseCSV(await f.text()).filter(r=>r.some(x=>String(x).trim()));
  if(rows.length<2){toast('That file looks empty');return}
  const g=guessColumns(rows[0]);IMP={rows,hdr:rows[0],number:g.number,desc:g.desc,cost:g.cost,list:g.list,brand:g.brand,supplier:f.name.replace(/\.[^.]+$/,''),useList:g.list>=0&&g.cost<0};
  sheet(impSheet);
});
function impSheet(){
  const opt=(k)=>`<select data-m="imp" data-f="${k}" data-redraw="1"><option value="-1">(none)</option>${IMP.hdr.map((h,i)=>`<option value="${i}" ${+IMP[k]===i?'selected':''}>${esc(h||'Column '+(i+1))}</option>`).join('')}</select>`;
  const sample=IMP.rows.slice(1,4).map(r=>`${esc(r[IMP.number]||'')} | ${esc(r[IMP.desc]||'')} | ${esc(r[IMP.cost]||r[IMP.list]||'')}`).join('<br>');
  return shHead('Import price list')+`<div class="sheet-b"><p class="sub">${IMP.rows.length-1} rows found. Check the columns match.</p>
  ${fld('Part number column',opt('number'))}${fld('Description column',opt('desc'))}${fld('Your cost column',opt('cost'))}${fld('List or retail column',opt('list'))}${fld('Brand column',opt('brand'))}
  ${fld('Supplier name',inp('imp','supplier',IMP.supplier))}
  <label class="chk"><input type="checkbox" data-m="imp" data-f="useList" ${IMP.useList?'checked':''}> Use the list column as customer price (otherwise cost + ${num(S.settings.partsMarkup)}%)</label>
  <div class="card sub">Preview:<br><span class="vin">${sample}</span></div>
  <button class="btn pri" data-act="impGo">Import</button></div>`}
ACT.impGo=()=>{
  const n=+IMP.number;if(n<0){toast('Choose the part number column');return}
  let add=0,upd=0;
  for(const r of IMP.rows.slice(1)){
    const number=String(r[n]||'').trim();if(!number)continue;
    const cost=IMP.cost>=0?String(num(r[IMP.cost])||''):'',list=IMP.list>=0?String(num(r[IMP.list])||''):'';
    const price=IMP.useList&&list?list:(cost?String(priceFromCost(cost,S.settings.partsMarkup)):list);
    let p=findPart(number);const d={number,desc:IMP.desc>=0?String(r[IMP.desc]||'').trim():'',brand:IMP.brand>=0?String(r[IMP.brand]||'').trim():'',supplier:IMP.supplier||''};
    if(p){Object.assign(p,{...d,desc:d.desc||p.desc});if(cost)p.cost=cost;if(price)p.price=price;upd++}
    else{S.parts.push({id:uid(),uses:0,last:'',upc:'',cost,price,...d});add++}
  }
  persistNow();popSheet();toast(add+' added, '+upd+' updated');
};
ACT.exportParts=()=>saveFile('parts.csv',csvOut([['Part number','Description','Brand','Supplier','Cost','Price','UPC'],...S.parts.map(p=>[p.number,p.desc,p.brand,p.supplier,p.cost,p.price,p.upc])]),'text/csv');
ACT.needFromPart=(b,e)=>{e.stopPropagation();const p=S.parts.find(x=>x.id===b.dataset.id);addNeed(p.number+' '+p.desc,'1','Parts stock');toast('Added to shop needs')};

/* ---------- Shop needs ---------- */
let NP=null;
function addNeed(text,qty,cat,photo){const m=me(),n={id:uid(),text,qty:qty||'1',cat:cat||'Shop supplies',by:m?m.id:'',at:today(),done:false};S.needs.push(n);
  if(photo){const p={id:uid(),jobId:'needs',kind:'need',refId:n.id,caption:'',at:new Date().toISOString(),by:m?m.id:'',data:photo};P.push(p);idbPut(p)}persistNow()}
const needPhoto=id=>P.find(p=>p.kind==='need'&&p.refId===id);
function dropNeedPhotos(ids){const set=new Set(ids);P.filter(p=>p.kind==='need'&&set.has(p.refId)).forEach(p=>idbDel(p.id));P=P.filter(p=>!(p.kind==='need'&&set.has(p.refId)))}
document.addEventListener('change',async e=>{
  if(e.target.id!=='nPhoto'&&e.target.id!=='nPhoto2')return;const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const c=await fileToCanvas(f,1400);NP=c.toDataURL('image/jpeg',.8);const pv=$('#nPrev');if(pv)pv.innerHTML=`<div class="ph" style="width:84px"><img src="${NP}" alt="Photo to attach"><button data-act="needPhotoClear" aria-label="Remove photo">&times;</button></div>`}catch(x){toast(x.message)}
});
ACT.needPhotoClear=()=>{NP=null;const pv=$('#nPrev');if(pv)pv.innerHTML=''};
function vNeeds(){
  const open=S.needs.filter(n=>!n.done),done=S.needs.filter(n=>n.done);
  return `<div class="between"><h2>Shop needs</h2><div class="btnrow" style="flex:none"><button class="btn sm" data-act="copyNeeds">Copy list</button>${done.length?'<button class="btn sm" data-act="clearNeeds">Clear checked</button>':''}</div></div>
  <div class="card sec"><div class="sec"><label class="field"><span class="sr">Item</span><input id="nText" type="text" placeholder="What does the shop need?" autocomplete="off"></label>
   <label class="field"><span class="sr">Category</span><select id="nCat">${NEED_CATS.map(c=>`<option>${c}</option>`).join('')}</select></label></div>
   <div class="btnrow"><input id="nQty" type="text" inputmode="numeric" placeholder="Qty" value="1" style="max-width:90px" aria-label="Quantity"><label class="btn" style="cursor:pointer">Take photo<input id="nPhoto" type="file" accept="image/*" capture="environment" hidden></label><label class="btn" style="cursor:pointer">From library<input id="nPhoto2" type="file" accept="image/*" hidden></label></div>
   <div id="nPrev">${NP?`<div class="ph" style="width:84px"><img src="${NP}" alt="Photo to attach"><button data-act="needPhotoClear" aria-label="Remove photo">&times;</button></div>`:''}</div>
   <button class="btn pri" data-act="addNeed">Add to list</button></div>
  ${NEED_CATS.map(cat=>{const l=open.filter(n=>n.cat===cat);return l.length?`<div class="card sec"><h3>${cat}</h3>${l.map(needRow).join('')}</div>`:''}).join('')||'<div class="empty">Nothing needed right now.</div>'}
  ${done.length?`<div class="card sec"><h3>Ordered or bought</h3>${done.map(needRow).join('')}</div>`:''}`;
}
const needRow=n=>{const ph=needPhoto(n.id);return `${ph?`<div class="due"><img src="${ph.data}" data-act="viewPhoto" data-id="${ph.id}" alt="Photo of ${esc(n.text)}" style="width:56px;height:56px;object-fit:cover;border-radius:8px;cursor:zoom-in;flex:none">`:'<div class="due">'}<label class="chk grow" style="flex:1 1 170px"><input type="checkbox" data-act="needToggle" data-id="${n.id}" ${n.done?'checked':''}><span class="grow" style="${n.done?'text-decoration:line-through;opacity:.6':''}">${esc(n.text)} <span class="sub">x${esc(n.qty)} &middot; ${esc((staffOf(n.by)||{}).name||'')} ${fmtDate(n.at)}</span></span></label></div>`};
ACT.addNeed=()=>{const t=$('#nText').value.trim();if(!t){toast('Type what is needed');return}addNeed(t,$('#nQty').value,$('#nCat').value,NP);NP=null;render()};
ACT.needToggle=b=>{const n=S.needs.find(x=>x.id===b.dataset.id);n.done=b.checked;persistNow();render()};
ACT.clearNeeds=()=>{dropNeedPhotos(S.needs.filter(n=>n.done).map(n=>n.id));S.needs=S.needs.filter(n=>!n.done);persistNow();render()};
ACT.copyNeeds=()=>copyText(NEED_CATS.map(c=>{const l=S.needs.filter(n=>!n.done&&n.cat===c);return l.length?c+':\n'+l.map(n=>'- '+n.text+' x'+n.qty).join('\n'):''}).filter(Boolean).join('\n\n')||'Nothing needed');

/* ---------- Settings ---------- */
function vSettings(){
  const st=S.settings,adm=me()&&me().role==='admin',off=isAdmin();
  return `<h2>Settings</h2>
  ${off?`<div class="card sec"><h3>Shop</h3>${fld('Shop name',inp('set','shopName',st.shopName))}<div class="g2">${fld('Phone',inp('set','phone',st.phone,{type:'tel',fmt:'phone'}))}${fld('Address',inp('set','address',st.address))}</div>
   <div class="g3">${fld('Labor rate',inp('set','laborRate',st.laborRate,{mode:'decimal'}))}${fld('Parts markup %',inp('set','partsMarkup',st.partsMarkup,{mode:'decimal'}))}${fld('Sales tax %',inp('set','taxRate',st.taxRate,{mode:'decimal'}))}</div>
   <label class="chk"><input type="checkbox" data-m="set" data-f="laborTaxable" ${st.laborTaxable?'checked':''}> Charge tax on labor</label>
   <label class="chk"><input type="checkbox" data-m="set" data-f="techPrices" data-redraw="1" ${st.techPrices?'checked':''}> Technicians can see prices</label>
   ${fld('Invoice footer',area('set','invNote',st.invNote))}</div>
  <div class="card sec"><h3>People</h3>${S.staff.map(s=>`<div class="row">${dotH(s)}${inp('staff:'+s.id,'name',s.name)}<select data-m="staff:${s.id}" data-f="role" aria-label="Role"><option value="admin" ${s.role==='admin'?'selected':''}>Admin</option><option value="office" ${s.role==='office'?'selected':''}>Office</option><option value="tech" ${s.role==='tech'?'selected':''}>Tech</option></select>
    <label class="chk" style="flex:none"><input type="checkbox" data-m="staff:${s.id}" data-f="active" ${s.active?'checked':''}>On</label></div>`).join('')}
   <button class="btn" data-act="addStaff">+ Add person</button></div>
  <div class="card sec"><h3>Inspection checklist</h3><div class="sub">One item per line. Use "Group: item" to group them.</div>${area('set','checklistText',st.checklistText)}</div>`:''}
  <div class="card sec"><h3>Backup</h3><div class="sub">Everything is stored in this browser only. Export a backup regularly, and before clearing browser data.</div>
   <div class="btnrow"><button class="btn" data-act="backup">Export backup</button><label class="btn" style="cursor:pointer">Restore backup<input type="file" accept=".json" hidden id="restoreFile"></label></div></div>
  <div class="card sec"><h3>About</h3><div class="sub">Bloom Repair version ${APP_VERSION} (${APP_DATE})</div></div>
  <div class="card sec"><h3>Sample data</h3>${S.demo?'<div class="sub">Sample customers and jobs are loaded.</div><button class="btn" data-act="clearDemo">Remove sample data</button>':'<button class="btn" data-act="loadDemo">Load sample data</button>'}</div>`;
}
ACT.addStaff=()=>{S.staff.push({id:uid(),name:'New person',role:'tech',color:COLORS[S.staff.length%COLORS.length],active:true});persistNow();render()};
ACT.loadDemo=()=>{seedDemo();persistNow();render()};
ACT.clearDemo=()=>{if(confirm('Remove the sample customers, vehicles, jobs and parts?')){clearDemo();render()}};
ACT.backup=()=>{saveFile('bloom-repair-backup-'+today()+'.json',JSON.stringify({app:'bloom-repair',S,photos:P}),'application/json')};
document.addEventListener('change',async e=>{
  if(e.target.id!=='restoreFile')return;const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());if(d.app!=='bloom-repair'||!d.S)throw 0;
    if(!confirm('Replace everything in this browser with the backup?'))return;
    S=d.S;P=d.photos||[];persistNow();idbClear();P.forEach(idbPut);render();toast('Backup restored')}catch(x){toast('That is not a Bloom Repair backup')}
});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.m==='set'&&e.target.dataset.f==='techPrices')render()});

/* ---------- boot ---------- */
(async function boot(){
  S=load();let fresh=false;
  if(S)for(const j of S.jobs)if(j.status==='estimate')j.status='open';
  if(!S){S=defaults();fresh=true}
  else{const d=defaults();S.settings=Object.assign(d.settings,S.settings)}
  idb=await openIDB();P=await idbAll();
  if(fresh){seedDemo();persistNow()}
  render();
  if(!me())signIn();
  if('serviceWorker' in navigator){}
})();

/* ---------- favicon / home screen icon ---------- */
window.addEventListener('load',()=>{try{
  const S0=192,c=document.createElement('canvas');c.width=c.height=S0;const g=c.getContext('2d'),r=S0*.22;
  const gr=g.createLinearGradient(0,0,S0,S0);gr.addColorStop(0,'#0a4a9e');gr.addColorStop(1,'#002456');
  g.fillStyle=gr;g.beginPath();g.roundRect(0,0,S0,S0,r);g.fill();
  const hl=g.createLinearGradient(0,0,0,S0*.5);hl.addColorStop(0,'rgba(255,255,255,.14)');hl.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=hl;g.beginPath();g.roundRect(0,0,S0,S0*.5,[r,r,0,0]);g.fill();
  g.save();g.translate(S0*.17,S0*.17);g.scale(S0*.66/32,S0*.66/32);g.strokeStyle='#fff';g.fillStyle='#fff';g.lineWidth=2.6;g.lineCap='round';g.lineJoin='round';
  g.fill(new Path2D('M21.5 4.5a6.5 6.5 0 0 0-6.2 8.4L5 23.2a2.9 2.9 0 0 0 4.100 4.100l10.300-10.300a6.500 6.500 0 0 0 8.400-6.200l-4.300 4.300-3.400-.9-.9-3.400z'));g.stroke(new Path2D('M21.5 4.5a6.5 6.5 0 0 0-6.2 8.4L5 23.2a2.9 2.9 0 0 0 4.100 4.100l10.300-10.300a6.500 6.500 0 0 0 8.400-6.200l-4.300 4.300-3.400-.9-.9-3.400z'));g.restore();
  const u=c.toDataURL('image/png');
  for(const rel of ['icon','apple-touch-icon']){const l=document.createElement('link');l.rel=rel;l.href=u;document.head.appendChild(l)}
}catch(e){}});

</script>
</body>
